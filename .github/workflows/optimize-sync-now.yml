name: Optimize POS sync now
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'fix: speed up product sync and server recovery'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sync performance
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # _app.js: fast startup/background product refresh without long waits.
          p = Path('pages/_app.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const PRODUCT_SYNC_TIMEOUT = 60000;", "const PRODUCT_SYNC_TIMEOUT = 8000;")
          s = s.replace("const PRODUCT_SYNC_INTERVAL = 30000;", "const PRODUCT_SYNC_INTERVAL = 60000;")
          old = """    const response = await fetch('/api/woocommerce/products?_sync=' + Date.now(), {\n      method: 'GET',\n      cache: 'no-store',\n      headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate' },\n    });"""
          new = """    const controller = new AbortController();\n    const timer = window.setTimeout(() => controller.abort(), PRODUCT_SYNC_TIMEOUT);\n    const response = await fetch('/api/woocommerce/products?_sync=' + Date.now(), {\n      method: 'GET',\n      cache: 'no-store',\n      signal: controller.signal,\n      headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate' },\n    });\n    window.clearTimeout(timer);"""
          if old in s:
              s = s.replace(old, new, 1)
          else:
              raise SystemExit('_app product fetch block not found')
          old_effect = """    // Directe synchronisatie zodra de POS na login wordt geopend.\n    // Daarna iedere 30 seconden opnieuw.\n    sync();\n    const interval = window.setInterval(sync, PRODUCT_SYNC_INTERVAL);\n    return () => {\n      stopped = true;\n      window.clearInterval(interval);\n    };"""
          new_effect = """    // Directe synchronisatie bij openen/login, daarna iedere minuut.\n    // Bij terugkeer online/focus/zichtbaarheid direct opnieuw synchroniseren.\n    sync();\n    const interval = window.setInterval(sync, PRODUCT_SYNC_INTERVAL);\n    const wake = () => { if (!document.hidden) sync(); };\n    window.addEventListener('online', wake);\n    window.addEventListener('focus', wake);\n    document.addEventListener('visibilitychange', wake);\n    return () => {\n      stopped = true;\n      window.clearInterval(interval);\n      window.removeEventListener('online', wake);\n      window.removeEventListener('focus', wake);\n      document.removeEventListener('visibilitychange', wake);\n    };"""
          if old_effect in s:
              s = s.replace(old_effect, new_effect, 1)
          else:
              raise SystemExit('_app product sync effect not found')
          p.write_text(s, encoding='utf-8')

          # index.js: never wait 120s for a product request and recover online mode quickly.
          p = Path('pages/index.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const [serverOnline, setServerOnline] = useState(false);", "const [serverOnline, setServerOnline] = useState(true);")
          s = s.replace("const serverCheckState = useRef({failures:0,checking:false});", "const serverCheckState = useRef({failures:0,checking:false});")
          s = s.replace("setTimeout(() => controller.abort(), 3000)", "setTimeout(() => controller.abort(), 1200)")
          s = s.replace("if (serverCheckState.current.failures >= 2) { setServerOnline(false); localStorage.setItem('pos_server_online','0'); }", "if (serverCheckState.current.failures >= 3) { setServerOnline(false); localStorage.setItem('pos_server_online','0'); }")
          s = s.replace("fetchWithServerCheck(`/api/woocommerce/products?_sync=${Date.now()}`,{},120000)", "fetchWithServerCheck(`/api/woocommerce/products?_sync=${Date.now()}`,{},10000)")
          s = s.replace("const health=setInterval(tick,15000);", "const health=setInterval(tick,5000);")
          # Make online/focus/visibility wake the POS immediately instead of waiting for the next timer.
          old_tick = """    const online=()=>tick();\n    window.addEventListener('online',online);\n    return()=>{clearInterval(health);clearInterval(sync);window.removeEventListener('online',online);};"""
          new_tick = """    const online=()=>tick();\n    const wake=()=>{if(!document.hidden)tick();};\n    window.addEventListener('online',online);\n    window.addEventListener('focus',wake);\n    document.addEventListener('visibilitychange',wake);\n    return()=>{clearInterval(health);clearInterval(sync);window.removeEventListener('online',online);window.removeEventListener('focus',wake);document.removeEventListener('visibilitychange',wake);};"""
          if old_tick in s:
              s = s.replace(old_tick, new_tick, 1)
          else:
              raise SystemExit('index server recovery effect not found')
          p.write_text(s, encoding='utf-8')

          # products.js: reduce round trips and avoid forcing a new TCP connection per request.
          p = Path('pages/api/woocommerce/products.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("    Connection: 'close',\n", "")
          s = s.replace("    const batchSize = 50;", "    const batchSize = 100;")
          s = s.replace("    const variationBatchSize = 8;", "    const variationBatchSize = 20;")
          p.write_text(s, encoding='utf-8')

          # Self-delete this one-shot patch workflow after it has applied successfully.
          Path('.github/workflows/optimize-sync-now.yml').unlink(missing_ok=True)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/_app.js pages/index.js pages/api/woocommerce/products.js .github/workflows/optimize-sync-now.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: speed up product sync and server recovery"
          git push
