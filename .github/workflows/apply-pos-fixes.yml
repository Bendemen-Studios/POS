name: Apply POS fixes

on:
  push:
    paths:
      - '.github/workflows/apply-pos-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch POS
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('pages/index.js')
          s = p.read_text()

          old = """  const [showPaymentModal, setShowPaymentModal] = useState(false);\n  const [selectedPaymentMethod, setSelectedPaymentMethod] = useState('sumup');\n  const [cashGiven, setCashGiven] = useState('');"""
          new = """  const [showPaymentModal, setShowPaymentModal] = useState(false);\n  const [selectedPaymentMethod, setSelectedPaymentMethod] = useState('sumup');\n  const [paymentMethodByStore, setPaymentMethodByStore] = useState(() => {\n    if (typeof window === 'undefined') return {};\n    try { return JSON.parse(localStorage.getItem('pos_payment_method_by_store') || '{}'); } catch (_) { return {}; }\n  });\n  const [cashGiven, setCashGiven] = useState('');"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """  useEffect(() => {\n    if (typeof window !== 'undefined') localStorage.setItem('pos_active_tab', activeTab);\n  }, [activeTab]);\n\n  const formatAttributes"""
          new = """  useEffect(() => {\n    if (typeof window !== 'undefined') localStorage.setItem('pos_active_tab', activeTab);\n  }, [activeTab]);\n\n  useEffect(() => {\n    if (!selectedStore) return;\n    const storeId = String(selectedStore.id || selectedStore.store_id || 1);\n    const methods = selectedStore.payment_methods || { sumup: true, manual_pin: true, cash: true };\n    const saved = paymentMethodByStore[storeId];\n    const allowed = method => (method === 'sumup' && methods.sumup !== false) || (method === 'manual_pin' && methods.manual_pin !== false) || (method === 'cash' && methods.cash !== false);\n    const fallback = methods.sumup !== false ? 'sumup' : methods.manual_pin !== false ? 'manual_pin' : 'cash';\n    if (saved && allowed(saved)) setSelectedPaymentMethod(saved);\n    else setSelectedPaymentMethod(fallback);\n  }, [selectedStore, paymentMethodByStore]);\n\n  const selectPaymentMethod = method => {\n    setSelectedPaymentMethod(method);\n    if (!selectedStore || typeof window === 'undefined') return;\n    const storeId = String(selectedStore.id || selectedStore.store_id || 1);\n    setPaymentMethodByStore(prev => {\n      const next = { ...prev, [storeId]: method };\n      localStorage.setItem('pos_payment_method_by_store', JSON.stringify(next));\n      return next;\n    });\n  };\n\n  const formatAttributes"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """    const methods = selectedStore?.payment_methods || { sumup: true, manual_pin: true, cash: true };\n    let validMethod = selectedPaymentMethod;"""
          new = """    const methods = selectedStore?.payment_methods || { sumup: true, manual_pin: true, cash: true };\n    const storeId = String(selectedStore?.id || selectedStore?.store_id || 1);\n    let validMethod = paymentMethodByStore[storeId] || selectedPaymentMethod;"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """    const staffAsCustomers = data.users.map(u => ({ id: `user_${u.id}`, first_name: u.username || '', last_name: u.role ? `(${u.role})` : '(Gebruiker)', email: u.email || `${u.username}@bendemen.local` }));"""
          new = """    const staffAsCustomers = data.users.map(u => ({ id: `user_${u.id}`, username: u.username || '', user_login: u.username || '', first_name: u.username || '', last_name: u.role ? `(${u.role})` : '(Gebruiker)', email: u.email || `${u.username}@bendemen.local` }));"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """  const filteredCustomers = customers.filter(c => `${c.first_name || ''} ${c.last_name || ''} ${c.email || ''}`.toLowerCase().includes(customerSearch.toLowerCase()));"""
          new = """  const filteredCustomers = customers.filter(c => `${c.first_name || ''} ${c.last_name || ''} ${c.email || ''} ${c.username || ''} ${c.user_login || ''} ${c.login || ''}`.toLowerCase().includes(customerSearch.toLowerCase()));"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """<div className=\"font-bold\">{customer.first_name} {customer.last_name || ''}</div><div className=\"text-[10px] text-gray-500\">{customer.email}</div>"""
          new = """<div className=\"font-bold\">{customer.first_name} {customer.last_name || ''}</div><div className=\"text-[10px] text-gray-500\">{customer.email}{(customer.username || customer.user_login) && ` · @${customer.username || customer.user_login}`}</div>"""
          assert old in s
          s = s.replace(old, new, 1)

          s = s.replace("onClick={() => setSelectedPaymentMethod('sumup')}", "onClick={() => selectPaymentMethod('sumup')}")
          s = s.replace("onClick={() => setSelectedPaymentMethod('manual_pin')}", "onClick={() => selectPaymentMethod('manual_pin')}")
          s = s.replace("onClick={() => setSelectedPaymentMethod('cash')}", "onClick={() => selectPaymentMethod('cash')}")

          old = """        if (successCount > 0) {\n          setCheckoutStatus({ success: true, message: `✅ ${successCount} offline bestelling(en) automatisch gesynchroniseerd!` });\n          await fetchProducts();\n        } else if"""
          new = """        if (successCount > 0) {\n          setCheckoutStatus({ success: true, message: `✅ ${successCount} offline bestelling(en) automatisch gesynchroniseerd!` });\n          await Promise.allSettled([fetchProducts(), fetchCustomers(), fetchUsersAsCustomers(), fetchPickupOrders(), fetchStores()]);\n          window.dispatchEvent(new CustomEvent('pos:ajax-refresh', { detail: { offlineOrdersSynced: successCount } }));\n        } else if"""
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)

          p = Path('pages/api/woocommerce/checkout.js')
          s = p.read_text()

          marker = """async function fetchWithTimeout(url, options, timeoutMs = 15000) {\n  const controller = new AbortController();\n  const timer = setTimeout(() => controller.abort(), timeoutMs);\n  try {\n    return await fetch(url, { ...options, signal: controller.signal });\n  } finally {\n    clearTimeout(timer);\n  }\n}\n"""
          insert = marker + """\nasync function fetchJsonWithTimeout(url, options, timeoutMs = 15000) {\n  const response = await fetchWithTimeout(url, options, timeoutMs);\n  const text = await response.text();\n  let data = {};\n  try { data = JSON.parse(text); } catch (_) {}\n  if (!response.ok) throw new Error(`HTTP ${response.status}: ${text}`);\n  return data;\n}\n\nasync function ensureBackordersForPos({ url, authHeader, lineItems }) {\n  const changed = [];\n  for (const item of lineItems) {\n    const productId = Number(item.product_id);\n    const variationId = Number(item.variation_id || 0);\n    const quantity = Math.max(1, Number(item.quantity || 1));\n    const endpoint = variationId > 0\n      ? `${url}/wp-json/wc/v3/products/${productId}/variations/${variationId}`\n      : `${url}/wp-json/wc/v3/products/${productId}`;\n    try {\n      const product = await fetchJsonWithTimeout(endpoint, { headers: { Authorization: authHeader, 'Content-Type': 'application/json' } });\n      const stock = product.stock_quantity;\n      const managing = product.manage_stock === true || product.manage_stock === 'yes' || product.manage_stock === 'parent';\n      if (!managing || stock === null || stock === undefined) continue;\n      if (Number(stock) < quantity && product.backorders !== 'yes') {\n        changed.push({ endpoint, backorders: product.backorders || 'no' });\n        await fetchJsonWithTimeout(endpoint, {\n          method: 'PUT',\n          headers: { Authorization: authHeader, 'Content-Type': 'application/json' },\n          body: JSON.stringify({ backorders: 'yes' })\n        });\n      }\n    } catch (error) {\n      console.warn('[CHECKOUT STOCK]: kon backorders niet tijdelijk inschakelen:', error.message);\n    }\n  }\n  return changed;\n}\n\nasync function restoreBackordersForPos({ authHeader, changed }) {\n  for (const item of changed) {\n    try {\n      await fetchJsonWithTimeout(item.endpoint, {\n        method: 'PUT',\n        headers: { Authorization: authHeader, 'Content-Type': 'application/json' },\n        body: JSON.stringify({ backorders: item.backorders })\n      });\n    } catch (error) {\n      console.warn('[CHECKOUT STOCK]: kon oorspronkelijke backorder-instelling niet herstellen:', error.message);\n    }\n  }\n}\n"""
          assert marker in s
          s = s.replace(marker, insert, 1)

          old = """    let responseOrder;\n\n    try {\n      const fetchRes = await fetchWithTimeout(`${url}/wp-json/wc/v3/orders`, {"""
          new = """    let responseOrder;\n    let temporaryBackorderChanges = [];\n    try {\n      // De POS mag bewust verkopen onder nul. WooCommerce laat negatieve voorraad alleen toe\n      // wanneer backorders voor het betreffende product/variatie zijn toegestaan. We zetten dit\n      // uitsluitend rond deze POS-transactie tijdelijk aan en herstellen daarna de oorspronkelijke instelling.\n      temporaryBackorderChanges = await ensureBackordersForPos({ url, authHeader, lineItems });\n\n      const fetchRes = await fetchWithTimeout(`${url}/wp-json/wc/v3/orders`, {"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """    if (!responseOrder?.id) throw new Error('WooCommerce gaf geen order-ID terug.');\n\n    if (claimed) await completeOrder(clientOrderId, responseOrder.id);"""
          new = """    if (!responseOrder?.id) throw new Error('WooCommerce gaf geen order-ID terug.');\n\n    await restoreBackordersForPos({ authHeader, changed: temporaryBackorderChanges });\n\n    if (claimed) await completeOrder(clientOrderId, responseOrder.id);"""
          assert old in s
          s = s.replace(old, new, 1)

          old = """    if (claimed) {\n      try { await releaseOrder(clientOrderId); } catch (releaseError) {"""
          new = """    if (typeof temporaryBackorderChanges !== 'undefined' && temporaryBackorderChanges.length) {\n      try { await restoreBackordersForPos({ authHeader, changed: temporaryBackorderChanges }); } catch (_) {}\n    }\n    if (claimed) {\n      try { await releaseOrder(clientOrderId); } catch (releaseError) {"""
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git add pages/index.js pages/api/woocommerce/checkout.js
          git commit -m 'fix: persist POS payment methods, offline queue refresh and customer search'
          git push

      - name: Remove patch workflow
        if: success()
        run: |
          git rm .github/workflows/apply-pos-fixes.yml
          git commit -m 'chore: remove temporary POS patch workflow'
          git push
