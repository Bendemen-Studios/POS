name: Apply customer and points offline patch

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'fix: offline customer points integration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch customer sync and offline points
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('pages/index.js')
          text = path.read_text(encoding='utf-8')

          def replace_arrow_function(src, name, replacement):
              marker = f'const {name}='
              start = src.find(marker)
              if start < 0:
                  raise SystemExit(f'{marker} not found')
              brace = src.find('{', start)
              if brace < 0:
                  raise SystemExit(f'opening brace for {name} not found')
              depth = 0
              quote = None
              escape = False
              i = brace
              while i < len(src):
                  ch = src[i]
                  if quote:
                      if escape:
                          escape = False
                      elif ch == '\\\\':
                          escape = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch in "'\"`":
                          quote = ch
                      elif ch == '{':
                          depth += 1
                      elif ch == '}':
                          depth -= 1
                          if depth == 0:
                              end = i + 1
                              if end < len(src) and src[end] == ';':
                                  end += 1
                              return src[:start] + replacement + src[end:]
                  i += 1
              raise SystemExit(f'could not parse {name}')

          old_customers = """const fetchCustomers=async()=>{try{const res=await fetchWithServerCheck('/api/woocommerce/customers',{},30000);const data=await res.json();if(data.success&&Array.isArray(data.customers)){setCustomers(data.customers);localStorage.setItem('pos_cached_customers',JSON.stringify(data.customers));}}catch(err){console.error('Fout bij ophalen klanten:',err);}};"""
          new_customers = """const fetchCustomers=async()=>{\n            let cached=[];\n            try{const raw=localStorage.getItem('pos_cached_customers');const parsed=raw?JSON.parse(raw):[];cached=Array.isArray(parsed)?parsed:[];}catch(_){}\n            if(cached.length)setCustomers(cached);\n            if(typeof navigator!=='undefined'&&navigator.onLine===false)return;\n            try{\n              const res=await fetchWithServerCheck('/api/woocommerce/customers',{},30000);\n              const data=await res.json();\n              if(data.success&&Array.isArray(data.customers)){\n                setCustomers(data.customers);\n                localStorage.setItem('pos_cached_customers',JSON.stringify(data.customers));\n              }\n            }catch(err){console.warn('[CUSTOMERS] Online refresh mislukt; lokale klantencache blijft behouden.',err.message);}\n          };"""
          if old_customers in text:
              text = text.replace(old_customers, new_customers, 1)
          elif "const fetchCustomers=async()=>{" not in text:
              raise SystemExit('fetchCustomers not found')

          replacement = """const handleRedeemPoints=async()=>{\n            if(!selectedCustomer){alert('Koppel eerst een klant voordat je punten kunt inwisselen.');return;}\n            const requested=Math.max(0,parseInt(pointsToRedeem,10)||0);\n            if(requested<=0){alert('Voer minimaal 1 punt in om in te wisselen.');return;}\n            const cachedBalance=Math.max(0,parseInt(selectedCustomer.points_balance ?? selectedCustomer.points ?? 0,10)||0);\n            const applyLocal=()=>{\n              if(requested>cachedBalance){alert(`Onvoldoende punten. Deze klant heeft ${cachedBalance} punten.`);return;}\n              const discount=Number((requested*0.05).toFixed(2));\n              const updated={...selectedCustomer,points_balance:cachedBalance-requested};\n              setSelectedCustomer(updated);\n              setRedeemedDiscount(discount);\n              setPointsToRedeem(requested);\n              try{localStorage.setItem('pos_selected_customer',JSON.stringify(updated));}catch(_){}\n              try{\n                const all=JSON.parse(localStorage.getItem('pos_cached_customers')||'[]');\n                if(Array.isArray(all)){\n                  const next=all.map(c=>String(c.id)===String(updated.id)?{...c,points_balance:updated.points_balance}:c);\n                  localStorage.setItem('pos_cached_customers',JSON.stringify(next));\n                  setCustomers(next);\n                }\n              }catch(_){}\n              return true;\n            };\n            if(typeof navigator!=='undefined'&&navigator.onLine===false){applyLocal();return;}\n            try{\n              const res=await fetchWithServerCheck('/api/woocommerce/points',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerId:selectedCustomer.id,pointsToRedeem:requested,action:'redeem',orderTotal:finalTotal})},5000);\n              const data=await res.json();\n              if(res.ok&&data.success){\n                const balance=Math.max(0,parseInt(data.pointsBalance,10)||0);\n                const updated={...selectedCustomer,points_balance:balance};\n                setSelectedCustomer(updated);\n                setRedeemedDiscount(parseFloat(data.discountAmount)||0);\n                setPointsToRedeem(requested);\n                localStorage.setItem('pos_selected_customer',JSON.stringify(updated));\n                try{\n                  const all=JSON.parse(localStorage.getItem('pos_cached_customers')||'[]');\n                  if(Array.isArray(all)){const next=all.map(c=>String(c.id)===String(updated.id)?{...c,points_balance:balance}:c);localStorage.setItem('pos_cached_customers',JSON.stringify(next));setCustomers(next);}\n                }catch(_){}\n              }else if(data?.offline||res.status===502||res.status===503){applyLocal();}\n              else{alert(data.message||data.error||'Punten konden niet worden ingewisseld.');}\n            }catch(_){applyLocal();}\n          };"""
          text = replace_arrow_function(text, 'handleRedeemPoints', replacement)
          path.write_text(text, encoding='utf-8')

          # Remove this temporary patcher before committing.
          Path('.github/workflows/fix-customer-points.yml').unlink(missing_ok=True)
          PY

      - name: Commit patched POS
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/index.js .github/workflows/fix-customer-points.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: offline customer points integration"
          git push
