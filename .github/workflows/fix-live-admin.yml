# Live Admin patch trigger: SumUp branch selector + 5s order polling
name: Fix live Admin SumUp and orders

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch Admin
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pages/admin.js')
          s = p.read_text()

          if 'selectedStoreForPairing' not in s:
              marker = "  const [selectedStoreForReader, setSelectedStoreForReader] = useState({});\n"
              if marker not in s:
                  raise SystemExit('SumUp reader state not found')
              s = s.replace(marker, marker + "  const [selectedStoreForPairing, setSelectedStoreForPairing] = useState('');\n", 1)

          old_fetch = """  const fetchSumUpReaders = async () => {
    try {
      const res = await fetch('/api/sumup/proxy?action=readers');
      const data = await res.json();
      if (data.success) {
        setSumUpReaders(data.readers || []);
      }
    } catch (err) {
      console.error('Kan geen SumUp apparaten ophalen via proxy:', err);
    }
  };"""
          new_fetch = """  const fetchSumUpReaders = async () => {
    try {
      const res = await fetch(`/api/sumup/proxy?action=readers&_ajax=${Date.now()}`, { cache: 'no-store' });
      const data = await res.json().catch(() => ({}));
      if (data.success) {
        const readers = Array.isArray(data.readers) ? data.readers : [];
        setSumUpReaders(readers);
        return readers;
      }
    } catch (err) {
      console.error('Kan geen SumUp apparaten ophalen via proxy:', err);
    }
    return [];
  };"""
          if old_fetch in s:
              s = s.replace(old_fetch, new_fetch, 1)

          pair_start = s.find("  const handlePairSumUp = async (e) => {")
          pair_end = s.find("\n\n  const handleUnlinkSumUp", pair_start)
          if pair_start != -1 and pair_end != -1 and 'selectedStoreForPairing' in s:
              pair_block = s[pair_start:pair_end]
              if 'assign-store' not in pair_block:
                  pair_new = """  const handlePairSumUp = async (e) => {
    e.preventDefault();
    if (!selectedStoreForPairing) {
      setSumUpStatusMsg('❌ Selecteer eerst een filiaal.');
      return;
    }
    setSumUpStatusMsg('Bezig met SumUp koppelen...');
    try {
      const beforeReaders = sumUpReaders || [];
      const res = await fetch('/api/sumup/proxy?action=pair', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pairingCode, name: terminalName })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.success) {
        setSumUpStatusMsg(`❌ Fout: ${data.error || 'Onbekende fout'}`);
        return;
      }
      setSumUpStatusMsg('SumUp gekoppeld. Filiaal wordt toegewezen...');
      setPairingCode('');
      setTerminalName('');
      let readers = await fetchSumUpReaders();
      let newReader = readers.find(r => !beforeReaders.some(old => String(old.id) === String(r.id)));
      for (let i = 0; i < 5 && !newReader; i++) {
        await new Promise(resolve => setTimeout(resolve, 1000));
        readers = await fetchSumUpReaders();
        newReader = readers.find(r => !beforeReaders.some(old => String(old.id) === String(r.id)));
      }
      if (!newReader) {
        setSumUpStatusMsg('⚠️ Apparaat gekoppeld, maar nog niet zichtbaar. Ververs en gebruik daarna "Koppel aan Filiaal".');
        return;
      }
      const assignRes = await fetch('/api/sumup/proxy?action=assign-store', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ storeId: selectedStoreForPairing, readerId: newReader.id })
      });
      const assignData = await assignRes.json().catch(() => ({}));
      if (assignRes.ok && assignData.success) {
        const store = stores.find(st => String(st.id || st.store_id) === String(selectedStoreForPairing));
        setSumUpStatusMsg(`✅ SumUp apparaat gekoppeld aan ${store?.store_name || store?.name || 'het gekozen filiaal'}!`);
        setSelectedStoreForPairing('');
        fetchStores();
        fetchSumUpReaders();
      } else {
        setSumUpStatusMsg(`⚠️ SumUp gekoppeld, maar filiaaltoewijzing mislukt: ${assignData.error || 'Onbekende fout'}`);
      }
    } catch (err) {
      console.error('SumUp pairing error:', err);
      setSumUpStatusMsg('❌ Netwerkfout bij koppelen.');
    }
  };"""
                  s = s[:pair_start] + pair_new + s[pair_end:]

          if 'value={selectedStoreForPairing}' not in s:
              button_marker = """                      <button type=\"submit\" className=\"bg-red-600 hover:bg-red-700 text-white font-bold p-2 rounded text-xs uppercase\">Koppelen</button>"""
              selector = """                      <select
                        value={selectedStoreForPairing}
                        onChange={(e) => setSelectedStoreForPairing(e.target.value)}
                        className=\"p-2 border rounded text-xs bg-white\"
                        required
                      >
                        <option value=\"\">-- Kies Filiaal --</option>
                        {stores.map(st => (
                          <option key={st.id || st.store_id} value={st.id || st.store_id}>
                            {st.store_name || st.name}
                          </option>
                        ))}
                      </select>
"""
              if button_marker not in s:
                  raise SystemExit('SumUp pairing button not found')
              s = s.replace(button_marker, selector + button_marker, 1)

          if 'setInterval(refreshOrders, 5000)' not in s:
              marker = "  const fetchUsers = async () => {"
              effect = """  useEffect(() => {
    if (activeTab !== 'orders') return undefined;
    let stopped = false;
    const refreshOrders = async () => {
      if (stopped) return;
      await fetchOrders();
      if (typeof window !== 'undefined') {
        window.dispatchEvent(new CustomEvent('pos:ajax-refresh', { detail: { source: 'admin-orders' } }));
      }
    };
    refreshOrders();
    const timer = setInterval(refreshOrders, 5000);
    return () => {
      stopped = true;
      clearInterval(timer);
    };
  }, [activeTab]);

"""
              if marker not in s:
                  raise SystemExit('fetchUsers marker not found')
              s = s.replace(marker, effect + marker, 1)

          old_orders = """  const fetchOrders = async () => {
    try {
      const res = await fetch('/api/woocommerce/orders');
      const data = await res.json();
      if (data.success && data.orders) {
        setOrders(data.orders);
        localStorage.setItem('admin_cached_orders', JSON.stringify(data.orders));
      }
    } catch (err) {
      console.error('Fout bij ophalen bestellingen:', err);
    }
  };"""
          new_orders = """  const fetchOrders = async () => {
    try {
      const res = await fetch(`/api/woocommerce/orders?_ajax=${Date.now()}`, {
        cache: 'no-store',
        headers: { 'X-Requested-With': 'XMLHttpRequest', 'Cache-Control': 'no-cache, no-store, must-revalidate' }
      });
      const data = await res.json();
      if (data.success && data.orders) {
        setOrders(data.orders);
        localStorage.setItem('admin_cached_orders', JSON.stringify(data.orders));
        if (typeof window !== 'undefined') {
          window.dispatchEvent(new CustomEvent('pos:orders-updated', { detail: { orders: data.orders } }));
        }
      }
    } catch (err) {
      console.error('Fout bij ophalen bestellingen:', err);
    }
  };"""
          if old_orders in s:
              s = s.replace(old_orders, new_orders, 1)

          p.write_text(s)
          PY

      - name: Commit patched Admin
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/admin.js
          git commit -m "fix: live SumUp branch selector and 5s orders AJAX [live-admin-fixed]"
          git push
