name: Optimize POS sync runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime sync
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # index.js: replace the short generic timeout with a practical default,
          # keep a fast server-status source in _app.js, and make POS data sync
          # cache-first + background + resilient.
          p = Path('pages/index.js')
          s = p.read_text()

          s = s.replace(
            "const fetchWithServerCheck = async (url, options={}, timeout=5000) =>",
            "const fetchWithServerCheck = async (url, options={}, timeout=30000) =>",
            1,
          )

          old_server_effect = """  useEffect(()=>{const online=()=>triggerOfflineSync(false);window.addEventListener('online',online);const interval=setInterval(async()=>{const ok=await checkServerConnection();if(ok)await triggerOfflineSync(false);},5000);return()=>{window.removeEventListener('online',online);clearInterval(interval);};},[]);"""
          new_server_effect = """  useEffect(()=>{const online=()=>triggerOfflineSync(false);const statusHandler=e=>{if(e?.detail?.online)triggerOfflineSync(false);};window.addEventListener('online',online);window.addEventListener('pos:server-status',statusHandler);return()=>{window.removeEventListener('online',online);window.removeEventListener('pos:server-status',statusHandler);};},[]);"""
          s = s.replace(old_server_effect, new_server_effect, 1)

          old_sync = """  const handleSyncData=async()=>{if(!(await checkServerConnection()))return;setIsSyncing(true);await Promise.all([fetchProducts(),fetchCustomers(),fetchUsersAsCustomers(),fetchPickupOrders(),fetchStores()]);await triggerOfflineSync(false);setIsSyncing(false);};"""
          new_sync = """  const handleSyncData=async()=>{if(typeof navigator!=='undefined'&&navigator.onLine===false)return;setIsSyncing(true);try{await Promise.allSettled([fetchProducts(),fetchCustomers(),fetchUsersAsCustomers(),fetchPickupOrders(),fetchStores()]);await triggerOfflineSync(false);}finally{setIsSyncing(false);}};"""
          s = s.replace(old_sync, new_sync, 1)

          # Product fetch: long enough for the server-side batch/variation sync,
          # and immediately fall back to local cache on a transient failure.
          s = re.sub(
            r"  const fetchProducts=async\(\)=>\{.*?\n  \};",
            """  const fetchProducts=async()=>{try{const res=await fetchWithServerCheck('/api/woocommerce/products?_sync='+Date.now(),{headers:{'Cache-Control':'no-cache, no-store, must-revalidate'}},120000);const data=await res.json();if(!res.ok||!data.success||!Array.isArray(data.products))throw new Error(data.error||`HTTP ${res.status}`);setProducts(data.products);localStorage.setItem('pos_cached_products',JSON.stringify(data.products));localStorage.setItem('pos_cached_products_updated_at',String(Date.now()));}catch(err){console.warn('[PRODUCTS] tijdelijke syncfout:',err.message);try{const cached=JSON.parse(localStorage.getItem('pos_cached_products')||'[]');if(Array.isArray(cached)&&cached.length)setProducts(prev=>prev.length?prev:cached);}catch(_){}}};""",
            s, count=1, flags=re.S,
          )

          s = re.sub(
            r"  const fetchCustomers=async\(\)=>\{.*?\n  \};",
            """  const fetchCustomers=async()=>{try{const res=await fetchWithServerCheck('/api/woocommerce/customers',{},45000);const data=await res.json();if(!res.ok||!data.success||!Array.isArray(data.customers))throw new Error(data.error||`HTTP ${res.status}`);setCustomers(data.customers);localStorage.setItem('pos_cached_customers',JSON.stringify(data.customers));}catch(err){console.warn('[CUSTOMERS] tijdelijke syncfout:',err.message);try{const cached=JSON.parse(localStorage.getItem('pos_cached_customers')||'[]');if(Array.isArray(cached)&&cached.length)setCustomers(prev=>prev.length?prev:cached);}catch(_){}}};""",
            s, count=1, flags=re.S,
          )

          s = re.sub(
            r"  const fetchPickupOrders=async\(\)=>\{.*?\n  \};",
            """  const fetchPickupOrders=async()=>{try{setLoadingPickup(true);const res=await fetchWithServerCheck('/api/woocommerce/pickup-order',{},60000);const data=await res.json();if(!res.ok||!data.success||!Array.isArray(data.orders))throw new Error(data.error||`HTTP ${res.status}`);const orders=data.orders;setPickupOrders(orders);localStorage.setItem('pos_cached_pickup_orders',JSON.stringify(orders));}catch(err){console.warn('[PICKUP] tijdelijke syncfout:',err.message);try{const cached=JSON.parse(localStorage.getItem('pos_cached_pickup_orders')||'[]');if(Array.isArray(cached))setPickupOrders(prev=>prev.length?prev:cached);}catch(_){}}finally{setLoadingPickup(false);}};""",
            s, count=1, flags=re.S,
          )

          s = s.replace(
            "  const handleSyncData=async()=>{if(typeof navigator!=='undefined'&&navigator.onLine===false)return;setIsSyncing(true);try{await Promise.allSettled([fetchProducts(),fetchCustomers(),fetchUsersAsCustomers(),fetchPickupOrders(),fetchStores()]);await triggerOfflineSync(false);}finally{setIsSyncing(false);}};",
            "  const handleSyncData=async()=>{if(typeof navigator!=='undefined'&&navigator.onLine===false)return;setIsSyncing(true);try{await Promise.allSettled([fetchProducts(),fetchCustomers(),fetchUsersAsCustomers(),fetchPickupOrders(),fetchStores()]);await triggerOfflineSync(false);}finally{setIsSyncing(false);}};",
          )

          # Startup: use cached store immediately, then perform background sync.
          s = s.replace(
            " const syncInBackground=async()=>{try{if(await checkServerConnection()) await handleSyncData();}catch(err){console.warn('[STARTUP SYNC] achtergrond sync mislukt:',err);}}; syncInBackground();",
            " const syncInBackground=async()=>{try{await handleSyncData();}catch(err){console.warn('[STARTUP SYNC] achtergrond sync mislukt:',err);}}; syncInBackground();",
            1,
          )

          # index owns its 30s product refresh; _app no longer performs a duplicate
          # product sync that competes with it.
          p.write_text(s)

          # _app.js: remove the product-specific fetch interception and the duplicate
          # product sync interval. Keep SumUp and server watcher intact.
          p = Path('pages/_app.js')
          s = p.read_text()
          start = "    if (url.pathname === '/api/woocommerce/products' && (init?.method || 'GET').toUpperCase() === 'GET') {"
          if start in s:
              pos = s.index(start)
              end = s.index("    if (url.pathname !== '/api/sumup/proxy')", pos)
              s = s[:pos] + s[end:]

          block = re.compile(r"\n  useEffect\(\(\)=>\{\n    if \(router\.pathname !== '/'[\s\S]*?\n  \}, \[router\.pathname\]\);", re.M)
          s = block.sub("\n", s, count=1)
          p.write_text(s)

          # points.js: customer is mandatory for every points operation, including
          # earned-points calculation, because the balance/customer identity is part
          # of the points check contract.
          p = Path('pages/api/woocommerce/points.js')
          s = p.read_text()
          calc = """    // Calculeren van verdiende punten heeft geen klantbalans nodig.\n    if (req.method === 'POST' && action === 'calculate_earned') {\n      const pointsEarned = Math.floor(parseFloat(orderTotal) || 0);\n      return res.status(200).json({ success: true, pointsEarned });\n    }\n\n    if (!customerId) {"""
          replacement = """    // Iedere puntencontrole vereist een gekoppelde WooCommerce-klant.\n    if (!customerId) {"""
          s = s.replace(calc, replacement, 1)
          calc2 = """    if (action === 'redeem') {"""
          if calc2 in s:
              insert = """    if (action === 'calculate_earned') {\n      const pointsEarned = Math.floor(parseFloat(orderTotal) || 0);\n      return res.status(200).json({ success: true, pointsEarned, pointsBalance: currentPoints });\n    }\n\n"""
              s = s.replace(calc2, insert + calc2, 1)
          p.write_text(s)
          PY

      - name: Remove this workflow after applying patch
        run: |
          rm -f .github/workflows/fix-sync-runtime.yml

      - name: Commit and push
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pages/index.js pages/_app.js pages/api/woocommerce/points.js .github/workflows/fix-sync-runtime.yml
          git diff --cached --quiet || git commit -m "fix: make POS sync cache-first and non-duplicated"
          git push
