name: Fix POS sync
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch POS runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('pages/index.js')
          s=p.read_text()
          if "const [serverOnline" not in s:
              s=s.replace("const [pendingOfflineCount, setPendingOfflineCount] = useState(0);", "const [pendingOfflineCount, setPendingOfflineCount] = useState(0);\n  const [serverOnline, setServerOnline] = useState(true);\n  const syncInFlight = useRef(false);", 1)
              s=s.replace("import { useState, useEffect } from 'react';", "import { useState, useEffect, useRef } from 'react';", 1)
          if "const checkServerConnection" not in s:
              marker="  const checkOfflineQueue=()=>"
              idx=s.find(marker)
              health="""  const checkServerConnection = async () => {\n    const controller = new AbortController();\n    const timer = setTimeout(() => controller.abort(), 5000);\n    try {\n      const res = await fetch(`/api/admin/store?_pos_health=${Date.now()}`, { method: 'GET', cache: 'no-store', credentials: 'same-origin', signal: controller.signal, headers: { 'Cache-Control': 'no-cache' } });\n      let data = null; try { data = await res.json(); } catch (_) {}\n      const online = res.ok && (!data || data.online !== false);\n      setServerOnline(online);\n      return online;\n    } catch (_) { setServerOnline(false); return false; }\n    finally { clearTimeout(timer); }\n  };\n\n"""
              if idx>=0: s=s[:idx]+health+s[idx:]
          # Make sync resilient and include stores/admin-backed stock data.
          old="""  const handleSyncData=async()=>{if(!(await checkServerConnection()))return;setIsSyncing(true);await Promise.all([fetchProducts(),fetchCustomers(),fetchUsersAsCustomers(),fetchPickupOrders(),fetchStores()]);await triggerOfflineSync(false);setIsSyncing(false);};"""
          new="""  const handleSyncData=async()=>{if(syncInFlight.current)return;if(typeof navigator!=='undefined'&&navigator.onLine===false)return;if(!(await checkServerConnection())){checkOfflineQueue();return;}syncInFlight.current=true;setIsSyncing(true);try{await Promise.allSettled([fetchProducts(),fetchCustomers(),fetchUsersAsCustomers(),fetchPickupOrders(),fetchStores()]);await triggerOfflineSync(false);setServerOnline(true);}finally{syncInFlight.current=false;setIsSyncing(false);}};"""
          s=s.replace(old,new,1)
          # Replace the old 5-minute effect if present; otherwise add one.
          pattern=r"\n  // Houd de kassa automatisch actueel: bij startup \+ iedere 5 minuten\.[\s\S]*?\n  \}, \[isSyncing\]\);"
          replacement="""\n  // Serverstatus: snel herstellen uit lokale modus. Volledige AJAX-sync: iedere 5 minuten.\n  useEffect(()=>{\n    const tick=async()=>{ const online=await checkServerConnection(); if(online) await handleSyncData(); else checkOfflineQueue(); };\n    tick();\n    const health=setInterval(tick,15000);\n    const sync=setInterval(tick,300000);\n    const online=()=>tick();\n    window.addEventListener('online',online);\n    return()=>{clearInterval(health);clearInterval(sync);window.removeEventListener('online',online);};\n  },[]);"""
          if re.search(pattern,s): s=re.sub(pattern,replacement,s,count=1)
          elif "const health=setInterval(tick,15000)" not in s:
              anchor="  const parsePaymentMethods="
              s=s.replace(anchor,replacement+"\n"+anchor,1)
          # Ensure successful product sync updates the POS cache immediately.
          s=s.replace("setProducts(data.products);localStorage.setItem('pos_cached_products',JSON.stringify(data.products));", "setProducts(data.products);localStorage.setItem('pos_cached_products',JSON.stringify(data.products));localStorage.setItem('admin_products',JSON.stringify(data.products));", 1)
          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          rm -f .github/workflows/fix-pos-sync.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pages/index.js .github/workflows/fix-pos-sync.yml
          git diff --cached --quiet || git commit -m "fix: restore POS server status and five-minute sync"
          git push
