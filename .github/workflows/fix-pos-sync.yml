name: Fix POS sync and admin inventory

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch POS synchronization
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('pages/index.js')
          s = index.read_text()
          s = s.replace("fullSyncTimer = setInterval(() => backgroundSync(true), 120000);", "fullSyncTimer = setInterval(() => backgroundSync(true), 300000);")

          old = "localStorage.setItem('pos_cached_products_updated_at', String(Date.now()));"
          new = "localStorage.setItem('pos_cached_products_updated_at', String(Date.now()));\n        localStorage.setItem('admin_products', JSON.stringify(data.products));\n        window.dispatchEvent(new CustomEvent('pos:inventory-synced', { detail: { products: data.products } }));"
          if old in s and "pos:inventory-synced" not in s:
              s = s.replace(old, new, 1)

          old = "window.addEventListener('pos:ajax-refresh', refreshLocalState);"
          new = "window.addEventListener('pos:ajax-refresh', refreshLocalState);\n    window.addEventListener('pos:inventory-synced', refreshLocalState);"
          if old in s and "window.addEventListener('pos:inventory-synced'" not in s:
              s = s.replace(old, new, 1)

          old = "window.removeEventListener('pos:ajax-refresh', refreshLocalState);"
          new = "window.removeEventListener('pos:ajax-refresh', refreshLocalState);\n      window.removeEventListener('pos:inventory-synced', refreshLocalState);"
          if old in s and "window.removeEventListener('pos:inventory-synced'" not in s:
              s = s.replace(old, new, 1)
          index.write_text(s)

          admin = Path('pages/admin.js')
          s = admin.read_text()
          marker = "  const fetchUsers = async () => {"
          effect = """  useEffect(() => {\n    let stopped = false;\n    const refreshInventory = async () => {\n      if (stopped || (typeof navigator !== 'undefined' && navigator.onLine === false)) return;\n      try {\n        await fetchProductsSilently();\n        if (typeof window !== 'undefined') window.dispatchEvent(new CustomEvent('pos:ajax-refresh'));\n      } catch (_) {}\n    };\n    refreshInventory();\n    const timer = setInterval(refreshInventory, 300000);\n    const onInventorySync = (event) => {\n      const synced = event?.detail?.products;\n      if (Array.isArray(synced)) {\n        setProducts(synced);\n        localStorage.setItem('admin_products', JSON.stringify(synced));\n      }\n    };\n    window.addEventListener('pos:inventory-synced', onInventorySync);\n    return () => {\n      stopped = true;\n      clearInterval(timer);\n      window.removeEventListener('pos:inventory-synced', onInventorySync);\n    };\n  }, []);\n\n"""
          if "setInterval(refreshInventory, 300000)" not in s:
              s = s.replace(marker, effect + marker, 1)

          s = s.replace("fetch('/api/woocommerce/products');", "fetch(`/api/woocommerce/products?_sync=${Date.now()}`, { cache: 'no-store' });")
          target = "localStorage.setItem('admin_products', JSON.stringify(data.products || []));"
          replacement = target + "\n        localStorage.setItem('pos_cached_products', JSON.stringify(data.products || []));\n        localStorage.setItem('pos_cached_products_updated_at', String(Date.now()));"
          if target in s and "pos_cached_products_updated_at" not in s:
              s = s.replace(target, replacement, 1)
          admin.write_text(s)
          PY

      - name: Patch admin offline popup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('pages/_app.js')
          s = p.read_text()

          marker = "const PRODUCT_CACHE_VERSION = 'v3-variations';\n"
          guard = '''
function installAdminOfflineMutationGuard() {
  if (typeof window === 'undefined' || window.__bendemenAdminOfflineMutationGuard) return () => {};
  window.__bendemenAdminOfflineMutationGuard = true;
  const originalFetch = window.fetch.bind(window);
  const mutationMethods = new Set(['POST', 'PUT', 'PATCH', 'DELETE']);

  window.fetch = async (input, init = {}) => {
    const rawUrl = typeof input === 'string' ? input : input?.url;
    const method = String(init?.method || (typeof input !== 'string' ? input?.method : 'GET') || 'GET').toUpperCase();
    if (rawUrl && window.location.pathname === '/admin' && mutationMethods.has(method) && window.__bendemenAdminOffline) {
      window.dispatchEvent(new CustomEvent('pos:admin-change-blocked'));
      return jsonResponse({ success: false, error: 'De VPS is offline. Admin-wijzigingen zijn tijdelijk geblokkeerd.' }, 503);
    }
    return originalFetch(input, init);
  };

  return () => {
    window.fetch = originalFetch;
    window.__bendemenAdminOfflineMutationGuard = false;
  };
}
'''
          if 'function installAdminOfflineMutationGuard()' not in s:
              assert marker in s, 'PRODUCT_CACHE_VERSION marker ontbreekt'
              s = s.replace(marker, marker + guard, 1)

          old = "  const [serverOnline, setServerOnline] = useState(true);\n"
          if 'adminOfflinePopupDismissed' not in s:
              assert old in s, 'serverOnline state marker ontbreekt'
              s = s.replace(old, old + "  const [adminOfflinePopupDismissed, setAdminOfflinePopupDismissed] = useState(false);\n", 1)

          old = "    installSumUpGatewayFetch();\n    registerNativePWA();\n"
          if 'stopAdminOfflineMutationGuard' not in s:
              assert old in s, 'startup marker ontbreekt'
              s = s.replace(old, "    installSumUpGatewayFetch();\n    const stopAdminOfflineMutationGuard = installAdminOfflineMutationGuard();\n    registerNativePWA();\n", 1)

          old = "    const statusHandler = (event) => setServerOnline(Boolean(event.detail?.online));\n    window.addEventListener('pos:server-status', statusHandler);\n"
          if 'const blockedHandler = () =>' not in s:
              assert old in s, 'status handler marker ontbreekt'
              new = '''    const statusHandler = (event) => {
      const online = Boolean(event.detail?.online);
      window.__bendemenAdminOffline = !online;
      setServerOnline(online);
      if (!online) setAdminOfflinePopupDismissed(false);
    };
    const blockedHandler = () => setAdminOfflinePopupDismissed(false);
    window.addEventListener('pos:server-status', statusHandler);
    window.addEventListener('pos:admin-change-blocked', blockedHandler);
'''
              s = s.replace(old, new, 1)

          old = "      stopServerWatcher();\n      stopOfflineBridge();\n      window.removeEventListener('pos:server-status', statusHandler);\n"
          if 'window.removeEventListener(\'pos:admin-change-blocked\'' not in s:
              assert old in s, 'cleanup marker ontbreekt'
              new = "      stopServerWatcher();\n      stopAdminOfflineMutationGuard();\n      stopOfflineBridge();\n      window.removeEventListener('pos:server-status', statusHandler);\n      window.removeEventListener('pos:admin-change-blocked', blockedHandler);\n"
              s = s.replace(old, new, 1)

          old = "  const adminOffline = router.pathname === '/admin' && !serverOnline;\n"
          if 'const showAdminOfflinePopup' not in s:
              assert old in s, 'adminOffline marker ontbreekt'
              s = s.replace(old, old + "  const showAdminOfflinePopup = adminOffline && !adminOfflinePopupDismissed;\n", 1)

          old = """      {adminOffline && (
        <div style={{ position: 'fixed', inset: 0, zIndex: 100000, background: 'rgba(17,24,39,.35)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
          <div style={{ maxWidth: 440, width: '100%', background: '#fff', borderRadius: 14, padding: 28, boxShadow: '0 18px 60px rgba(0,0,0,.3)', textAlign: 'center' }}>
            <div style={{ fontSize: 42, marginBottom: 10 }}>🔒</div>
            <div style={{ fontSize: 22, fontWeight: 800, marginBottom: 8 }}>Admin alleen-lezen</div>
            <div style={{ color: '#6b7280', fontSize: 14, lineHeight: 1.5 }}>
              De VPS is offline. Admin is tijdelijk geblokkeerd zodat er offline geen wijzigingen kunnen worden gemaakt.
              Je lokaal gecachte Admin-gegevens blijven beschikbaar zodra de server weer bereikbaar is.
            </div>
          </div>
        </div>
      )}
"""
          new = '''      {showAdminOfflinePopup && (
        <div style={{ position: 'fixed', inset: 0, zIndex: 100000, background: 'rgba(17,24,39,.20)', display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24, pointerEvents: 'none' }}>
          <div role="dialog" aria-modal="false" style={{ position: 'relative', maxWidth: 440, width: '100%', background: '#fff', borderRadius: 14, padding: 28, paddingTop: 24, boxShadow: '0 18px 60px rgba(0,0,0,.3)', textAlign: 'center', pointerEvents: 'auto' }}>
            <button type="button" aria-label="Melding sluiten" onClick={() => setAdminOfflinePopupDismissed(true)} style={{ position: 'absolute', top: 10, right: 12, border: 0, background: 'transparent', color: '#6b7280', fontSize: 24, lineHeight: 1, cursor: 'pointer', padding: 6 }}>×</button>
            <div style={{ fontSize: 42, marginBottom: 10 }}>🔒</div>
            <div style={{ fontSize: 22, fontWeight: 800, marginBottom: 8 }}>Admin alleen-lezen</div>
            <div style={{ color: '#6b7280', fontSize: 14, lineHeight: 1.5 }}>
              De VPS is offline. Admin-wijzigingen zijn tijdelijk geblokkeerd. Je lokaal gecachte Admin-gegevens blijven beschikbaar.
            </div>
            <div style={{ marginTop: 14, color: '#9ca3af', fontSize: 12 }}>Sluit deze melding met ×. Zodra de server weer online is, wordt Admin automatisch vrijgegeven.</div>
          </div>
        </div>
      )}
'''
          assert old in s, 'oude admin popup ontbreekt'
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/index.js pages/admin.js pages/_app.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: complete POS startup and admin offline blocking"
          git push
