name: POS points checkout patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch checkout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pages/api/woocommerce/checkout.js')
          s = p.read_text()
          marker = '// BDM_POS_EARNED_POINTS_SYNC_V2'
          if marker in s:
              print('points patch already installed')
              raise SystemExit(0)

          old_import = "import { redeemCustomerPoints } from '../../../lib/customerPoints';"
          new_import = "import { redeemCustomerPoints, syncEarnedCustomerPoints, calculateEarnedPoints } from '../../../lib/customerPoints';"
          if old_import not in s:
              raise SystemExit('checkout import marker not found')
          s = s.replace(old_import, new_import, 1)

          start = s.index('    // WooCommerce Points & Rewards now handles earned points')
          end_marker = '    if (claimed) await completeOrder(clientOrderId, responseOrder.id);'
          end = s.index(end_marker, start)

          new_block = '''    // BDM_POS_EARNED_POINTS_SYNC_V2
    // POS earning is authoritative: full euros + 1 point for cents 51-99.
    let pointsEarned = 0;
    let pointsSyncPending = false;
    let pointsResult = null;
    if (customerId && Number.isFinite(Number(customerId)) && Number(customerId) > 0) {
      pointsEarned = calculateEarnedPoints(totals?.totalPaid ?? responseOrder.total ?? 0);
      if (pointsEarned > 0) {
        try {
          pointsResult = await syncEarnedCustomerPoints({ customerId: Number(customerId), pointsEarned, orderId: Number(responseOrder.id) });
        } catch (pointsError) {
          pointsSyncPending = true;
          console.error('[CHECKOUT POINTS EARN]:', pointsError.message);
        }
      }
      if (Number(totals?.pointsUsed || 0) > 0) {
        try {
          const redeemResult = await redeemCustomerPoints({ customerId: Number(customerId), pointsUsed: Number(totals.pointsUsed), orderId: Number(responseOrder.id) });
          pointsResult = { ...(pointsResult || {}), redemption: redeemResult };
        } catch (pointsError) {
          pointsSyncPending = true;
          console.error('[CHECKOUT POINTS REDEEM]:', pointsError.message);
        }
      }
    }

'''
          s = s[:start] + new_block + s[end:]
          s = s.replace(
              'return res.status(200).json({ success: true, order: responseOrder, pointsSyncPending, pointsResult });',
              'return res.status(200).json({ success: true, order: responseOrder, pointsEarned, pointsSyncPending, pointsResult });',
              1,
          )
          p.write_text(s)
          print('checkout points patch applied')
          PY

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pages/api/woocommerce/checkout.js
          git diff --cached --quiet || git commit -m "fix: award POS earned points after checkout"
          git push
