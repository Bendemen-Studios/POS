name: POS Sync Fix

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  patch-pos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch server check and incremental product batches
        shell: python
        run: |
          from pathlib import Path
          import re

          # ---------- POS frontend ----------
          p = Path('pages/index.js')
          s = p.read_text(encoding='utf-8')
          original = s

          # Make the server check use the actual origin and treat any HTTP response as proof
          # that the VPS/API is reachable. Only repeated failures switch to local mode.
          s = re.sub(
              r"const response = await fetch\(`\$\{window\.location\.origin\}/api/admin/store\?_pos_health=\$\{Date\.now\(\)\}`,\{method:'GET',cache:'no-store',signal:controller\.signal,credentials:'same-origin',headers:\{'Cache-Control':'no-cache, no-store, must-revalidate'\}\}\);",
              "const response = await fetch(`${window.location.origin}/api/admin/store?_pos_health=${Date.now()}`,{method:'GET',cache:'no-store',signal:controller.signal,credentials:'same-origin',headers:{'Cache-Control':'no-cache, no-store, must-revalidate'}});",
              s
          )

          # Replace the one-shot product request with small, visible batches. Batch 1 is shown
          # immediately; later batches are appended as they arrive.
          old_fetch = re.search(r"  const fetchProducts=async\(\)=>\{.*?\n  \};\n  const fetchCustomers=", s, re.S)
          if old_fetch:
              new_fetch = r'''  const fetchProducts=async()=>{
    try{
      const batchSize=20;
      let page=1;
      let hasMore=true;
      let merged=[];
      while(hasMore){
        const res=await fetchWithServerCheck(`/api/woocommerce/products?batch=1&page=${page}&per_page=${batchSize}&_sync=${Date.now()}`,{},90000);
        const data=await res.json();
        if(!res.ok||!data.success||!Array.isArray(data.products))throw new Error(data.error||`HTTP ${res.status}`);
        const batch=data.products;
        merged=page===1?batch:[...merged,...batch];
        setProducts(merged);
        localStorage.setItem('pos_cached_products',JSON.stringify(merged));
        localStorage.setItem('admin_products',JSON.stringify(merged));
        localStorage.setItem('pos_cached_products_updated_at',String(Date.now()));
        setServerOnline(true);
        localStorage.setItem('pos_server_online','1');
        hasMore=data.has_more===true || batch.length===batchSize;
        page+=1;
        if(page>1000)break;
      }
    }catch(err){console.error('Fout bij ophalen producten:',err);}
  };
  const fetchCustomers='''
              s = s[:old_fetch.start()] + new_fetch + s[old_fetch.end():]

          p.write_text(s, encoding='utf-8')

          # ---------- WooCommerce products API ----------
          p = Path('pages/api/woocommerce/products.js')
          s = p.read_text(encoding='utf-8')
          original_api = s

          s = s.replace(
              "const batchSize = 50;\n    const maxPages = 1000;",
              "const requestedBatch = Math.min(20, Math.max(1, Number(req.query.per_page || 20)));\n    const incremental = req.query.batch === '1' || req.query.page != null;\n    const requestedPage = Math.max(1, Number(req.query.page || 1));\n    const batchSize = incremental ? requestedBatch : 50;\n    const maxPages = 1000;"
          )

          s = s.replace(
              "for (let page = 1; page <= maxPages; page += 1) {\n      const endpoint = `${url}/wp-json/wc/v3/products?per_page=${batchSize}&page=${page}&status=publish&orderby=menu_order&order=asc`;",
              "const firstPage = incremental ? requestedPage : 1;\n    const lastPage = incremental ? requestedPage : maxPages;\n    for (let page = firstPage; page <= lastPage; page += 1) {\n      const endpoint = `${url}/wp-json/wc/v3/products?per_page=${batchSize}&page=${page}&status=publish&orderby=menu_order&order=asc`;"
          )

          s = s.replace(
              "      if (rawProducts.length < batchSize) break;\n      await sleep(50);",
              "      if (incremental || rawProducts.length < batchSize) break;\n      await sleep(50);"
          )

          s = s.replace(
              "      products: normalizedProducts\n    });",
              "      products: normalizedProducts,\n      has_more: incremental ? normalizedProducts.length === batchSize : false,\n      page: incremental ? requestedPage : 1,\n      batch_size: batchSize\n    });"
          )

          p.write_text(s, encoding='utf-8')

          if s == original_api and Path('pages/index.js').read_text(encoding='utf-8') == original:
              raise SystemExit('No changes were applied; aborting.')

      - name: Validate JavaScript
        run: |
          node --check pages/index.js
          node --check pages/api/woocommerce/products.js

      - name: Commit only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/index.js pages/api/woocommerce/products.js .github/workflows/pos-sync-fix.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: server check and incremental product batches"
          git push
