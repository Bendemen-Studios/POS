name: POS Sync Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'pages/index.js'
      - '.github/workflows/pos-sync-fix.yml'

jobs:
  patch-pos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch only POS sync/server logic
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('pages/index.js')
          s = p.read_text(encoding='utf-8')
          original = s

          # Fix literal health URL to a real JS template literal.
          s = s.replace("'/api/admin/store?_pos_health=${Date.now()}'", "`/api/admin/store?_pos_health=${Date.now()}`")

          # Ensure health checks use the current POS origin and same-origin credentials.
          s = re.sub(
              r"const response = await fetch\(`/api/admin/store\?_pos_health=\$\{Date\.now\(\)\}`,\{method:'GET',cache:'no-store',signal:controller\.signal,headers:\{'Cache-Control':'no-cache, no-store, must-revalidate'\}\}\);",
              "const response = await fetch(`${window.location.origin}/api/admin/store?_pos_health=${Date.now()}`,{method:'GET',cache:'no-store',signal:controller.signal,credentials:'same-origin',headers:{'Cache-Control':'no-cache, no-store, must-revalidate'}});",
              s
          )

          # Make product sync authoritative, cache-busting and an online signal.
          old = "const res=await fetchWithServerCheck('/api/woocommerce/products');const data=await res.json();if(data.success&&data.products){setProducts(data.products);localStorage.setItem('pos_cached_products',JSON.stringify(data.products));localStorage.setItem('admin_products',JSON.stringify(data.products));}"
          new = "const res=await fetchWithServerCheck(`/api/woocommerce/products?_sync=${Date.now()}`,{},120000);const data=await res.json();if(!res.ok||!data.success||!Array.isArray(data.products))throw new Error(data.error||`HTTP ${res.status}`);setProducts(data.products);localStorage.setItem('pos_cached_products',JSON.stringify(data.products));localStorage.setItem('admin_products',JSON.stringify(data.products));localStorage.setItem('pos_cached_products_updated_at',String(Date.now()));setServerOnline(true);localStorage.setItem('pos_server_online','1');"
          if old in s:
              s = s.replace(old, new, 1)

          # navigator.onLine is not the VPS health signal; allow real API checks to decide.
          s = s.replace("if(typeof navigator!=='undefined'&&navigator.onLine===false)return;setIsSyncing(true);try{", "setIsSyncing(true);try{", 1)

          # Avoid overlapping full syncs.
          s = s.replace("const handleSyncData=async()=>{setIsSyncing(true);try{", "const handleSyncData=async()=>{if(isSyncing)return;setIsSyncing(true);try{", 1)

          if s == original:
              print('No changes required.')
          else:
              p.write_text(s, encoding='utf-8')
              print('Patched pages/index.js without replacing the file.')
