name: Fast online recovery
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server recovery
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('pages/_app.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('  let lastOnline = false;', '  let lastOnline = true;')
          s = s.replace('setTimeout(() => controller.abort(), 2500)', 'setTimeout(() => controller.abort(), 1200)')
          s = s.replace('if (failures >= 2) lastOnline = false;', 'if (failures >= 3) lastOnline = false;')
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/fast-online-recovery.yml').unlink(missing_ok=True)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/_app.js .github/workflows/fast-online-recovery.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: shorten local mode recovery"
          git push
