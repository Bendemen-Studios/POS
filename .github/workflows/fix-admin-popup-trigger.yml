name: Fix admin popup trigger

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch popup trigger
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pages/_app.js')
          s = p.read_text()
          old = "  const [adminOfflinePopupDismissed, setAdminOfflinePopupDismissed] = useState(false);"
          new = "  const [adminOfflinePopupDismissed, setAdminOfflinePopupDismissed] = useState(true);"
          assert old in s
          s = s.replace(old, new, 1)
          old = "      if (!online) setAdminOfflinePopupDismissed(false);"
          new = "      if (online) setAdminOfflinePopupDismissed(true);"
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/_app.js
          git commit -m "fix: show admin offline popup only when change is attempted"
          git rm .github/workflows/fix-admin-popup-trigger.yml
          git commit -m "chore: remove one-time admin popup patch workflow"
          git push
