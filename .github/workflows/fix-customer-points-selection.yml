name: Fix customer points selection

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Keep selected customer in sync with fresh WooCommerce data
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('pages/index.js')
          s = p.read_text()

          marker = "  // POS_POINTS_SELECTION_SYNC_V1"
          if marker in s:
              print('Customer points selection sync already installed')
              raise SystemExit(0)

          old = """  const fetchCustomers = async () => {
    try {
      const res = await fetchWithServerCheck('/api/woocommerce/customers');
      const data = await res.json();
      if (data.success && data.customers) { setCustomers(data.customers); localStorage.setItem('pos_cached_customers', JSON.stringify(data.customers)); }
    } catch (err) { console.error('Fout bij ophalen klanten:', err); }
  };"""

          new = """  const fetchCustomers = async () => {
    try {
      const res = await fetchWithServerCheck('/api/woocommerce/customers');
      const data = await res.json();
      if (data.success && Array.isArray(data.customers)) {
        setCustomers(data.customers);
        localStorage.setItem('pos_cached_customers', JSON.stringify(data.customers));

        // POS_POINTS_SELECTION_SYNC_V1
        // Never keep an old points balance in the selected customer object.
        setSelectedCustomer((previous) => {
          if (!previous) return previous;
          const fresh = data.customers.find((customer) => String(customer.id) === String(previous.id));
          return fresh ? { ...previous, ...fresh } : previous;
        });
      }
    } catch (err) { console.error('Fout bij ophalen klanten:', err); }
  };"""

          if old not in s:
              raise SystemExit('fetchCustomers marker not found')

          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pages/index.js
          git diff --cached --quiet || git commit -m "fix: refresh selected customer points from WooCommerce"
          git push
