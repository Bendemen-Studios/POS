name: POS polling fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: apply POS 5s polling fix'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Change POS polling to 5 seconds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pages/index.js')
          s = p.read_text()
          old = "    }, 15000);"
          new = "    }, 5000);"
          if old not in s:
              raise SystemExit('Expected 15000ms POS polling interval not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/index.js
          git commit -m "chore: apply POS 5s polling fix"
          git push

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/pos-poll-fix.yml || true
          git commit -m "chore: remove temporary POS poll workflow" || true
          git push || true
