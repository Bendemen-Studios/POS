name: Apply 5s AJAX polling
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'fix: 5s AJAX status and offline refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch polling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pages/index.js')
          s = p.read_text()
          s = s.replace("    }, 15000);", "    }, 5000);", 1)
          marker = "  useEffect(() => {\n    const handleOnlineEvent = () => { triggerOfflineSync(false); };"
          replacement = "  useEffect(() => {\n    const handleServerStatus = (event) => {\n      if (typeof event.detail?.online === 'boolean') {\n        setServerOnline(event.detail.online);\n        if (event.detail.online) triggerOfflineSync(false);\n      }\n    };\n    window.addEventListener('pos:server-status', handleServerStatus);\n    const handleOnlineEvent = () => { triggerOfflineSync(false); };"
          if marker not in s:
              raise SystemExit('status effect marker not found')
          s = s.replace(marker, replacement, 1)
          old = "    return () => { window.removeEventListener('online', handleOnlineEvent); clearInterval(interval); };"
          new = "    return () => { window.removeEventListener('online', handleOnlineEvent); window.removeEventListener('pos:server-status', handleServerStatus); clearInterval(interval); };"
          if old not in s:
              raise SystemExit('cleanup marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('pages/_app.js')
          s = p.read_text()
          old = "      if (online) {\n        lastOnline = true;"
          new = "      if (online) {\n        lastOnline = true;\n        window.dispatchEvent(new CustomEvent('pos:server-status', { detail: { online: true } }));"
          if old not in s:
              raise SystemExit('online watcher marker not found')
          s = s.replace(old, new, 1)
          old = "      } else {\n        lastOnline = false;"
          new = "      } else {\n        lastOnline = false;\n        window.dispatchEvent(new CustomEvent('pos:server-status', { detail: { online: false } }));"
          if old not in s:
              raise SystemExit('offline watcher marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/index.js pages/_app.js
          git commit -m "fix: 5s AJAX status and offline refresh"
          git push
      - name: Remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-polling.yml
          git commit -m "chore: remove temporary polling workflow"
          git push
