name: Fix POS startup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: !contains(github.event.head_commit.message, '[pos-startup-patched]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch startup flow
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('pages/index.js')
          text = p.read_text()

          old = "const [currentUser, setCurrentUser] = useState(null);"
          new = "const [currentUser, setCurrentUser] = useState(() => { if (typeof window !== 'undefined') { try { const saved = localStorage.getItem('pos_user'); return saved ? JSON.parse(saved) : null; } catch (_) {} } return null; });"
          if old in text:
              text = text.replace(old, new, 1)

          text = text.replace("const [isChecking, setIsChecking] = useState(true);", "const [isChecking, setIsChecking] = useState(false);", 1)

          old_effect = "useEffect(()=>{ const userStr=localStorage.getItem('pos_user'); if(!userStr){router.replace('/login');return;} try{setCurrentUser(JSON.parse(userStr));}catch(_){router.replace('/login');return;} const initialize=async()=>{checkOfflineQueue();const online=await checkServerConnection();if(online)await handleSyncData();else{const saved=localStorage.getItem('selectedStore')||localStorage.getItem('pos_selected_store');if(saved){try{handleSelectStore(JSON.parse(saved),false);}catch(_){}}}setIsChecking(false);};initialize(); },[router]);"
          new_effect = "useEffect(()=>{ const userStr=localStorage.getItem('pos_user'); if(!userStr){router.replace('/login');return;} try{const parsed=JSON.parse(userStr);setCurrentUser(parsed);}catch(_){router.replace('/login');return;} checkOfflineQueue(); const saved=localStorage.getItem('selectedStore')||localStorage.getItem('pos_selected_store'); if(saved&&!localStorage.getItem('pos_selected_store')) localStorage.setItem('pos_selected_store',saved); if(saved){try{handleSelectStore(JSON.parse(saved),false);}catch(_){}} (async()=>{const online=await checkServerConnection(); if(online){ try{await handleSyncData();}catch(err){console.warn('[STARTUP SYNC]',err?.message||err);} }})(); },[router]);"
          if old_effect in text:
              text = text.replace(old_effect, new_effect, 1)

          old_fetch = "const fetchWithServerCheck = async (url, options={}, timeout=5000) => {"
          new_fetch = "const fetchWithServerCheck = async (url, options={}, timeout=15000) => {"
          if old_fetch in text:
              text = text.replace(old_fetch, new_fetch, 1)

          old_health = "const response = await fetch('/api/admin/store?healthcheck=1',{method:'GET',cache:'no-store',signal:controller.signal,headers:{'Cache-Control':'no-cache, no-store, must-revalidate'}});"
          new_health = "const response = await fetch('/api/admin/store?_pos_health=' + Date.now(),{method:'GET',cache:'no-store',signal:controller.signal,headers:{'Cache-Control':'no-cache, no-store, must-revalidate','X-POS-Health-Check':'1'}});"
          if old_health in text:
              text = text.replace(old_health, new_health, 1)

          old_products = "const fetchProducts=async()=>{try{const res=await fetchWithServerCheck('/api/woocommerce/products');const data=await res.json();if(data.success&&data.products){setProducts(data.products);localStorage.setItem('pos_cached_products',JSON.stringify(data.products));}}catch(err){console.error('Fout bij ophalen producten:',err);}};"
          new_products = "const fetchProducts=async()=>{try{const url='/api/woocommerce/products?_sync='+Date.now();const res=await fetchWithServerCheck(url,{method:'GET'},120000);const data=await res.json();if(data.success&&Array.isArray(data.products)){setProducts(data.products);localStorage.setItem('pos_cached_products',JSON.stringify(data.products));localStorage.setItem('pos_cached_products_updated_at',String(Date.now()));}}catch(err){console.warn('[PRODUCT SYNC] tijdelijke fout:',err?.name==='AbortError'?'timeout':(err?.message||err));}};"
          if old_products in text:
              text = text.replace(old_products, new_products, 1)

          # Keep the POS interactive even when background sync is still running.
          text = text.replace("if (isChecking || !currentUser) return <div", "if (!currentUser) return <div", 1)

          p.write_text(text)
          PY

      - name: Commit patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/index.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: make POS startup cache-first [pos-startup-patched]"
          git push
