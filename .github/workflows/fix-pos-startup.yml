name: Fix POS startup

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: !contains(github.event.head_commit.message, '[pos-startup-patched]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch startup, cache and service worker
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # POS startup: cached state must be usable immediately. Background work may never block the UI.
          p = Path('pages/index.js')
          text = p.read_text()

          text = text.replace(
              "if (typeof window !== 'undefined') return localStorage.getItem('pos_server_online') !== '0';",
              "if (typeof window !== 'undefined') { if (typeof navigator !== 'undefined' && navigator.onLine === false) return false; return localStorage.getItem('pos_server_online') !== '0'; }",
              1,
          )

          # Never let the first background sync start while the browser already knows it is offline.
          text = text.replace(
              "// Eerste sync na render: geen startup-knop meer nodig.\n    backgroundSync(true);",
              "// Eerste sync na render: alleen starten als de browser online is. Offline blijft de lokale cache direct leidend.\n    if (typeof navigator === 'undefined' || navigator.onLine !== false) backgroundSync(true);",
              1,
          )

          # React to product-cache updates without remounting the entire POS.
          text = text.replace(
              "window.addEventListener('storage', refreshLocalState);\n    window.addEventListener('pos:ajax-refresh', refreshLocalState);\n    return () => { window.removeEventListener('storage', refreshLocalState); window.removeEventListener('pos:ajax-refresh', refreshLocalState); };",
              "window.addEventListener('storage', refreshLocalState);\n    window.addEventListener('pos:ajax-refresh', refreshLocalState);\n    window.addEventListener('pos:products-updated', refreshLocalState);\n    return () => { window.removeEventListener('storage', refreshLocalState); window.removeEventListener('pos:ajax-refresh', refreshLocalState); window.removeEventListener('pos:products-updated', refreshLocalState); };",
              1,
          )

          p.write_text(text)

          # PWA service worker: if the browser reports offline, NEVER wait on a network timeout before using cache.
          p = Path('public/sw.js')
          text = p.read_text()
          text = text.replace("const CACHE_NAME = 'bendemen-pos-v16';", "const CACHE_NAME = 'bendemen-pos-v17';", 1)

          old_product = "async function handleProductRequest(request) {\n  // Online-first: nieuwe WooCommerce-productdata heeft altijd voorrang.\n  const fresh = await refreshApiCache(request, PRODUCT_API_TIMEOUT);"
          new_product = "async function handleProductRequest(request) {\n  // Offline: cache-first zonder netwerkvertraging.\n  if (self.navigator && self.navigator.onLine === false) {\n    const cache = await caches.open(CACHE_NAME);\n    const cached = await cache.match('/api/woocommerce/products') || await cache.match(request);\n    if (cached) return cached;\n  }\n\n  // Online-first: nieuwe WooCommerce-productdata heeft altijd voorrang.\n  const fresh = await refreshApiCache(request, PRODUCT_API_TIMEOUT);"
          if old_product in text:
              text = text.replace(old_product, new_product, 1)

          old_nav = "      // ONLINE-FIRST navigatie: de actuele site/VPS krijgt altijd voorrang.\n      try {\n        const response = await timeoutFetch(request, NAVIGATION_TIMEOUT);"
          new_nav = "      // Als de browser offline is, ga direct naar de lokale PWA-shell. Geen 2,5s netwerk-wachtperiode.\n      if (self.navigator && self.navigator.onLine === false) {\n        if (cached) return cached;\n        const rootCached = await cache.match('/');\n        if (rootCached) return rootCached;\n        const loginCached = await cache.match(OFFLINE_URL);\n        if (loginCached) return loginCached;\n      }\n\n      // ONLINE-FIRST navigatie: de actuele site/VPS krijgt altijd voorrang.\n      try {\n        const response = await timeoutFetch(request, NAVIGATION_TIMEOUT);"
          if old_nav in text:
              text = text.replace(old_nav, new_nav, 1)

          p.write_text(text)

          # App-level product cache: never delete a usable old cache merely because the cache schema version changed.
          p = Path('pages/_app.js')
          text = p.read_text()
          old_cache_version = "    if (cacheVersion !== PRODUCT_CACHE_VERSION) {\n      localStorage.removeItem('pos_cached_products');\n      localStorage.setItem('pos_cached_products_version', PRODUCT_CACHE_VERSION);\n    }"
          new_cache_version = "    if (cacheVersion !== PRODUCT_CACHE_VERSION) {\n      // Bewaar bestaande producten: een trage/offline server mag de POS niet terugbrengen naar 0 producten.\n      if (localStorage.getItem('pos_cached_products')) {\n        localStorage.setItem('pos_cached_products_version', PRODUCT_CACHE_VERSION);\n      } else {\n        localStorage.setItem('pos_cached_products_version', PRODUCT_CACHE_VERSION);\n      }\n    }"
          if old_cache_version in text:
              text = text.replace(old_cache_version, new_cache_version, 1)

          # Do not remount the complete POS after a background product sync.
          text = text.replace(
              "<Component key={router.pathname === '/' ? productSyncVersion : undefined} {...pageProps} />",
              "<Component {...pageProps} />",
              1,
          )

          p.write_text(text)
          PY

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/index.js pages/_app.js public/sw.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: instant offline startup and cache-first products [pos-startup-patched]"
          git push
