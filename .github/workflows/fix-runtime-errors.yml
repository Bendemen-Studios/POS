name: Fix POS runtime requests

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply runtime fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Keep SumUp traffic same-origin. The page-level fetch wrapper
          # must only special-case payment flow; readers/pair/unlink/assign
          # should hit the local Next.js proxy to avoid browser CORS errors.
          p = Path('pages/_app.js')
          s = p.read_text()

          old_product = """    if (url.pathname === '/api/woocommerce/products' && (init?.method || 'GET').toUpperCase() === 'GET') {
      const productUrl = new URL(url.toString());
      productUrl.searchParams.set('_sync', String(Date.now()));
      const productController = new AbortController();
      const productTimer = setTimeout(() => productController.abort(), PRODUCT_SYNC_TIMEOUT);
      try {
        return await originalFetch(productUrl.toString(), {
          ...init,
          cache: 'no-store',
          signal: productController.signal,
          headers: {
            ...(init?.headers || {}),
            'Cache-Control': 'no-cache, no-store, must-revalidate',
          },
        });
      } finally {
        clearTimeout(productTimer);
      }
    }

"""
          if old_product in s:
              s = s.replace(old_product, '', 1)

          start = "    if (url.pathname !== '/api/sumup/proxy') return originalFetch(input, init);"
          end = "    return originalFetch(gatewayUrl.toString(), nextInit);\n  };\n}"
          if start not in s or end not in s:
              raise SystemExit('SumUp wrapper markers not found')

          prefix, remainder = s.split(start, 1)
          block, suffix = remainder.split(end, 1)
          new_block = r'''    if (url.pathname !== '/api/sumup/proxy') return originalFetch(input, init);

    // Alle admin/readers/pair/unlink/assign-verzoeken blijven same-origin.
    // Alleen de betaalactie heeft extra client-side polling nodig.
    if (url.searchParams.get('action') !== 'pay' || (init?.method || 'GET').toUpperCase() !== 'POST') {
      return originalFetch(input, init);
    }

    const nextInit = { ...init };
    const headers = new Headers(init?.headers || (typeof input !== 'string' ? input.headers : undefined));
    nextInit.headers = headers;

    let body = {};
    try { body = typeof init.body === 'string' ? JSON.parse(init.body) : {}; } catch {}
    const totalAmount = Number(body.totalAmount ?? body.amount ?? body.total ?? 0);
    if (Number.isFinite(totalAmount) && totalAmount < 1) {
      window.alert('SumUp-betalingen moeten minimaal €1,00 zijn.');
      return jsonResponse({ success: false, pending: false, status: 'FAILED', error: 'Het minimale bedrag voor een SumUp-betaling is €1,00.' }, 400);
    }

    try {
      const rawStore = localStorage.getItem('selectedStore') || localStorage.getItem('pos_selected_store');
      const store = rawStore ? JSON.parse(rawStore) : null;
      if (!body.readerId && store?.terminal_id) body.readerId = store.terminal_id;
    } catch {}

    nextInit.body = JSON.stringify(body);
    headers.set('Content-Type', 'application/json');
    const startResponse = await originalFetch(input, nextInit);
    const startData = await startResponse.json().catch(() => ({}));
    if (!startResponse.ok || !startData?.success) return jsonResponse(startData, startResponse.status);
    if (!startData.clientTransactionId) return jsonResponse({ success: false, error: 'SumUp gaf geen client_transaction_id terug. Controleer de Solo voordat je opnieuw probeert te betalen.' }, 502);

    const result = await pollSumUpTransaction(startData.clientTransactionId, originalFetch);
    return jsonResponse(result, result.success ? 200 : 409);'''
          s = prefix + new_block + suffix
          p.write_text(s)

          # 2) The page already has the global fast server watcher from _app.js.
          # Remove the second 5-second health-check loop from index.js.
          p = Path('pages/index.js')
          s = p.read_text()
          old_effect = """  useEffect(()=>{const online=()=>triggerOfflineSync(false);window.addEventListener('online',online);const interval=setInterval(async()=>{const ok=await checkServerConnection();if(ok)await triggerOfflineSync(false);},5000);return()=>{window.removeEventListener('online',online);clearInterval(interval);};},[]);"""
          new_effect = """  useEffect(()=>{const online=()=>triggerOfflineSync(false);const status=e=>{if(e?.detail?.online)triggerOfflineSync(false);};window.addEventListener('online',online);window.addEventListener('pos:server-status',status);return()=>{window.removeEventListener('online',online);window.removeEventListener('pos:server-status',status);};},[]);"""
          if old_effect in s:
              s = s.replace(old_effect, new_effect, 1)
          else:
              print('index health effect already changed; continuing')

          old_sync = """  const handleSyncData=async()=>{if(!(await checkServerConnection()))return;setIsSyncing(true);await Promise.all([fetchProducts(),fetchCustomers(),fetchUsersAsCustomers(),fetchPickupOrders(),fetchStores()]);await triggerOfflineSync(false);setIsSyncing(false);};"""
          new_sync = """  const handleSyncData=async()=>{if(typeof navigator!=='undefined'&&navigator.onLine===false)return;setIsSyncing(true);try{await Promise.allSettled([fetchProducts(),fetchCustomers(),fetchUsersAsCustomers(),fetchPickupOrders(),fetchStores()]);await triggerOfflineSync(false);}finally{setIsSyncing(false);}};"""
          if old_sync in s:
              s = s.replace(old_sync, new_sync, 1)

          old_products = """  const fetchProducts=async()=>{try{const res=await fetchWithServerCheck('/api/woocommerce/products');const data=await res.json();if(data.success&&data.products){setProducts(data.products);localStorage.setItem('pos_cached_products',JSON.stringify(data.products));}}catch(err){console.error('Fout bij ophalen producten:',err);}};"""
          new_products = """  const fetchProducts=async()=>{try{const res=await fetchWithServerCheck('/api/woocommerce/products',{},180000);const data=await res.json();if(!res.ok||!data.success||!Array.isArray(data.products))throw new Error(data.error||`HTTP ${res.status}`);setProducts(data.products);localStorage.setItem('pos_cached_products',JSON.stringify(data.products));}catch(err){console.warn('[PRODUCTS] sync tijdelijk niet beschikbaar:',err.message);try{const cached=JSON.parse(localStorage.getItem('pos_cached_products')||'[]');if(Array.isArray(cached)&&cached.length)setProducts(prev=>prev.length?prev:cached);}catch(_){}}};"""
          if old_products in s:
              s = s.replace(old_products, new_products, 1)

          old_customers = """  const fetchCustomers=async()=>{try{const res=await fetchWithServerCheck('/api/woocommerce/customers',{},30000);const data=await res.json();if(data.success&&Array.isArray(data.customers)){setCustomers(data.customers);localStorage.setItem('pos_cached_customers',JSON.stringify(data.customers));}}catch(err){console.error('Fout bij ophalen klanten:',err);}};"""
          new_customers = """  const fetchCustomers=async()=>{try{const res=await fetchWithServerCheck('/api/woocommerce/customers',{},45000);const data=await res.json();if(!res.ok||!data.success||!Array.isArray(data.customers))throw new Error(data.error||`HTTP ${res.status}`);setCustomers(data.customers);localStorage.setItem('pos_cached_customers',JSON.stringify(data.customers));}catch(err){console.warn('[CUSTOMERS] sync tijdelijk niet beschikbaar:',err.message);try{const cached=JSON.parse(localStorage.getItem('pos_cached_customers')||'[]');if(Array.isArray(cached)&&cached.length)setCustomers(prev=>prev.length?prev:cached);}catch(_){}}};"""
          if old_customers in s:
              s = s.replace(old_customers, new_customers, 1)

          old_pickup = """  const fetchPickupOrders=async()=>{try{setLoadingPickup(true);const res=await fetchWithServerCheck('/api/woocommerce/pickup-order',{},30000);const data=await res.json();if(data.success){setPickupOrders(Array.isArray(data.orders)?data.orders:[]);localStorage.setItem('pos_cached_pickup_orders',JSON.stringify(Array.isArray(data.orders)?data.orders:[]));}}catch(err){console.error('Fout bij ophalen afhaalbestellingen:',err);}finally{setLoadingPickup(false);}};"""
          new_pickup = """  const fetchPickupOrders=async()=>{try{setLoadingPickup(true);const res=await fetchWithServerCheck('/api/woocommerce/pickup-order',{},60000);const data=await res.json();if(!res.ok||!data.success||!Array.isArray(data.orders))throw new Error(data.error||`HTTP ${res.status}`);const orders=data.orders;setPickupOrders(orders);localStorage.setItem('pos_cached_pickup_orders',JSON.stringify(orders));}catch(err){console.warn('[PICKUP] sync tijdelijk niet beschikbaar:',err.message);try{const cached=JSON.parse(localStorage.getItem('pos_cached_pickup_orders')||'[]');if(Array.isArray(cached))setPickupOrders(prev=>prev.length?prev:cached);}catch(_){}}finally{setLoadingPickup(false);}};"""
          if old_pickup in s:
              s = s.replace(old_pickup, new_pickup, 1)

          p.write_text(s)

          # 3) Admin SumUp calls use a dedicated same-origin alias so the
          # browser cannot be redirected to the external gateway.
          p = Path('pages/admin.js')
          s = p.read_text()
          s2 = s.replace("'/api/sumup/proxy", "'/api/sumup/admin-proxy")
          s2 = s2.replace('`/api/sumup/proxy', '`/api/sumup/admin-proxy')
          if s2 == s:
              print('admin SumUp paths already patched')
          p.write_text(s2)

          # 4) Do not require a customer for calculate_earned. Redeeming points
          # still requires a valid customer balance.
          p = Path('pages/api/woocommerce/points.js')
          s = p.read_text()
          old_guard = """    if (!customerId) {
      return res.status(400).json({
        success: false,
        message: 'Koppel eerst een klant voordat je punten kunt gebruiken.'
      });
    }

    const currentPoints = await getCustomerPoints(customerId);

    if (req.method === 'GET') {"""
          new_guard = """    const { orderTotal, pointsToRedeem, action } = req.body || {};

    // Berekenen van verdiende punten heeft geen klantbalans nodig.
    if (req.method === 'POST' && action === 'calculate_earned') {
      const pointsEarned = Math.floor(parseFloat(orderTotal) || 0);
      return res.status(200).json({ success: true, pointsEarned });
    }

    if (!customerId) {
      return res.status(400).json({
        success: false,
        message: 'Koppel eerst een klant voordat je punten kunt gebruiken.'
      });
    }

    const currentPoints = await getCustomerPoints(customerId);

    if (req.method === 'GET') {"""
          if old_guard in s:
              s = s.replace(old_guard, new_guard, 1)
              old_duplicate = """    const { orderTotal, pointsToRedeem, action } = req.body || {};

    if (action === 'calculate_earned') {
      const pointsEarned = Math.floor(parseFloat(orderTotal) || 0);
      return res.status(200).json({ success: true, pointsEarned, pointsBalance: currentPoints });
    }
"""
              if old_duplicate in s:
                  s = s.replace(old_duplicate, '', 1)
          p.write_text(s)
          PY

      - name: Add local SumUp admin proxy alias
        run: |
          cat > pages/api/sumup/admin-proxy.js <<'EOF'
          export { default } from './proxy';
          EOF

      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pages/_app.js pages/index.js pages/admin.js pages/api/woocommerce/points.js pages/api/sumup/admin-proxy.js
          git diff --cached --quiet || git commit -m "fix: stabilize runtime requests and local SumUp admin proxy"
          git push
