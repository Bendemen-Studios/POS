name: Package BDM POS Core
on:
  pull_request:
    paths:
      - 'plugins/core-plugin/**'
      - '.github/workflows/package-core.yml'
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create plugin ZIP
        run: |
          cd plugins
          zip -r "$GITHUB_WORKSPACE/bdmpos-core-0.12.0.zip" core-plugin
      - uses: actions/upload-artifact@v4
        with:
          name: bdmpos-core-0.12.0
          path: bdmpos-core-0.12.0.zip
          if-no-files-found: error
