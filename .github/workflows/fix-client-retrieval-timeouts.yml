name: Fix client retrieval timeouts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch POS client retrieval timeouts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pages/index.js')
          s = p.read_text()
          old = "const fetchCustomers=async()=>{try{const res=await fetchWithServerCheck('/api/woocommerce/customers');const data=await res.json();if(data.success&&data.customers)setCustomers(data.customers);}catch(err){console.error('Fout bij ophalen klanten:',err);}};"
          new = "const fetchCustomers=async()=>{try{const res=await fetchWithServerCheck('/api/woocommerce/customers',{},30000);const data=await res.json();if(data.success&&Array.isArray(data.customers)){setCustomers(data.customers);localStorage.setItem('pos_cached_customers',JSON.stringify(data.customers));}}catch(err){console.error('Fout bij ophalen klanten:',err);}};"
          if old not in s: raise SystemExit('fetchCustomers pattern not found')
          s = s.replace(old,new,1)
          old = "const fetchPickupOrders=async()=>{try{setLoadingPickup(true);const res=await fetchWithServerCheck('/api/woocommerce/pickup-order');const data=await res.json();if(data.success)setPickupOrders(data.orders||[]);}catch(err){console.error('Fout bij ophalen afhaalbestellingen:',err);}finally{setLoadingPickup(false);}};"
          new = "const fetchPickupOrders=async()=>{try{setLoadingPickup(true);const res=await fetchWithServerCheck('/api/woocommerce/pickup-order',{},30000);const data=await res.json();if(data.success){setPickupOrders(Array.isArray(data.orders)?data.orders:[]);localStorage.setItem('pos_cached_pickup_orders',JSON.stringify(Array.isArray(data.orders)?data.orders:[]));}}catch(err){console.error('Fout bij ophalen afhaalbestellingen:',err);}finally{setLoadingPickup(false);}};"
          if old not in s: raise SystemExit('fetchPickupOrders pattern not found')
          s = s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pages/index.js
          git diff --cached --quiet || git commit -m "fix: increase client retrieval timeouts and cache customers/pickups"
          git push
