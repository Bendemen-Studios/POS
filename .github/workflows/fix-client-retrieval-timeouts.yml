name: Fix client retrieval and cache

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch POS client retrieval and fast cache
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pages/index.js')
          s = p.read_text()

          marker = "  const checkOfflineQueue=()=>{const q=JSON.parse(localStorage.getItem('pos_offline_orders')||'[]');setPendingOfflineCount(q.length);};"
          helper = r'''  const POS_CACHE_DB='bendemen-pos-cache-v1';
  const POS_CACHE_STORE='data';
  const openPosCache=()=>new Promise((resolve,reject)=>{if(typeof window==='undefined'||!window.indexedDB)return resolve(null);const request=indexedDB.open(POS_CACHE_DB,1);request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains(POS_CACHE_STORE))request.result.createObjectStore(POS_CACHE_STORE);};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});
  const posCacheGet=async key=>{try{const db=await openPosCache();if(!db)return null;return await new Promise((resolve,reject)=>{const tx=db.transaction(POS_CACHE_STORE,'readonly');const req=tx.objectStore(POS_CACHE_STORE).get(key);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);});}catch(_){return null;}};
  const posCacheSet=async(key,value)=>{try{const db=await openPosCache();if(!db)return;await new Promise((resolve,reject)=>{const tx=db.transaction(POS_CACHE_STORE,'readwrite');tx.objectStore(POS_CACHE_STORE).put(value,key);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});}catch(_){} };
  const hydrateFastCache=async()=>{const [cachedProducts,cachedCustomers,cachedPickup]=await Promise.all([posCacheGet('products'),posCacheGet('customers'),posCacheGet('pickup_orders')]);if(Array.isArray(cachedProducts)&&cachedProducts.length)setProducts(prev=>prev.length?prev:cachedProducts);if(Array.isArray(cachedCustomers)&&cachedCustomers.length)setCustomers(prev=>prev.length?prev:cachedCustomers);if(Array.isArray(cachedPickup))setPickupOrders(prev=>prev.length?prev:cachedPickup);};
  const checkOfflineQueue=()=>{const q=JSON.parse(localStorage.getItem('pos_offline_orders')||'[]');setPendingOfflineCount(q.length);};'''
          if marker not in s: raise SystemExit('cache marker not found')
          if "const POS_CACHE_DB='bendemen-pos-cache-v1';" not in s:
              s=s.replace(marker,helper,1)

          old="  useEffect(()=>{ if(typeof window!=='undefined'&&products.length>0)localStorage.setItem('pos_cached_products',JSON.stringify(products)); },[products]);"
          new="  useEffect(()=>{ if(typeof window!=='undefined'&&products.length>0){localStorage.setItem('pos_cached_products',JSON.stringify(products));posCacheSet('products',products);} },[products]);"
          if old in s: s=s.replace(old,new,1)

          old="  useEffect(()=>{ if(typeof window!=='undefined'&&customers.length>0)localStorage.setItem('pos_cached_customers',JSON.stringify(customers)); },[customers]);"
          new="  useEffect(()=>{ if(typeof window!=='undefined'&&customers.length>0){localStorage.setItem('pos_cached_customers',JSON.stringify(customers));posCacheSet('customers',customers);} },[customers]);"
          if old in s: s=s.replace(old,new,1)

          old="  useEffect(()=>{ const userStr=localStorage.getItem('pos_user'); if(!userStr){router.replace('/login');return;} try{setCurrentUser(JSON.parse(userStr));}catch(_){router.replace('/login');return;} checkOfflineQueue(); const saved=localStorage.getItem('selectedStore')||localStorage.getItem('pos_selected_store'); if(saved){try{handleSelectStore(JSON.parse(saved),false);}catch(_){}} setIsChecking(false); const syncInBackground=async()=>{try{if(await checkServerConnection()) await handleSyncData();}catch(err){console.warn('[STARTUP SYNC] achtergrond sync mislukt:',err);}}; syncInBackground(); },[router]);"
          new="  useEffect(()=>{ const userStr=localStorage.getItem('pos_user'); if(!userStr){router.replace('/login');return;} try{setCurrentUser(JSON.parse(userStr));}catch(_){router.replace('/login');return;} checkOfflineQueue(); hydrateFastCache(); const saved=localStorage.getItem('selectedStore')||localStorage.getItem('pos_selected_store'); if(saved){try{handleSelectStore(JSON.parse(saved),false);}catch(_){}} setIsChecking(false); const syncInBackground=async()=>{try{await handleSyncData();}catch(err){console.warn('[STARTUP SYNC] achtergrond sync mislukt:',err);}}; syncInBackground(); },[router]);"
          if old in s: s=s.replace(old,new,1)

          old="  const handleSyncData=async()=>{if(!(await checkServerConnection()))return;setIsSyncing(true);await Promise.all([fetchProducts(),fetchCustomers(),fetchUsersAsCustomers(),fetchPickupOrders(),fetchStores()]);await triggerOfflineSync(false);setIsSyncing(false);};"
          new="  const handleSyncData=async()=>{if(typeof navigator!=='undefined'&&navigator.onLine===false)return;setIsSyncing(true);try{await Promise.allSettled([fetchProducts(),fetchCustomers(),fetchUsersAsCustomers(),fetchPickupOrders(),fetchStores()]);await triggerOfflineSync(false);}finally{setIsSyncing(false);}};"
          if old in s: s=s.replace(old,new,1)

          old="  const fetchCustomers=async()=>{try{const res=await fetchWithServerCheck('/api/woocommerce/customers',{},30000);const data=await res.json();if(data.success&&Array.isArray(data.customers)){setCustomers(data.customers);localStorage.setItem('pos_cached_customers',JSON.stringify(data.customers));}}catch(err){console.error('Fout bij ophalen klanten:',err);}};"
          new="  const fetchCustomers=async()=>{try{const res=await fetchWithServerCheck('/api/woocommerce/customers',{},45000);const data=await res.json();if(data.success&&Array.isArray(data.customers)){setCustomers(data.customers);localStorage.setItem('pos_cached_customers',JSON.stringify(data.customers));await posCacheSet('customers',data.customers);}}catch(err){console.warn('[CUSTOMERS] tijdelijke syncfout:',err.message);const cached=await posCacheGet('customers');if(Array.isArray(cached)&&cached.length)setCustomers(cached);}};"
          if old in s: s=s.replace(old,new,1)

          old="  const fetchPickupOrders=async()=>{try{setLoadingPickup(true);const res=await fetchWithServerCheck('/api/woocommerce/pickup-order',{},30000);const data=await res.json();if(data.success){setPickupOrders(Array.isArray(data.orders)?data.orders:[]);localStorage.setItem('pos_cached_pickup_orders',JSON.stringify(Array.isArray(data.orders)?data.orders:[]));}}catch(err){console.error('Fout bij ophalen afhaalbestellingen:',err);}finally{setLoadingPickup(false);}};"
          new="  const fetchPickupOrders=async()=>{try{setLoadingPickup(true);const res=await fetchWithServerCheck('/api/woocommerce/pickup-order',{},60000);const data=await res.json();if(!res.ok||!data.success)throw new Error(data.error||data.message||`HTTP ${res.status}`);const orders=Array.isArray(data.orders)?data.orders:[];setPickupOrders(orders);localStorage.setItem('pos_cached_pickup_orders',JSON.stringify(orders));await posCacheSet('pickup_orders',orders);}catch(err){console.warn('[PICKUP] tijdelijke syncfout:',err.message);const cached=await posCacheGet('pickup_orders');if(Array.isArray(cached))setPickupOrders(cached);}finally{setLoadingPickup(false);}};"
          if old in s: s=s.replace(old,new,1)

          p.write_text(s)
          PY
      - name: Commit patched POS and remove one-time workflows
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pages/index.js
          git diff --cached --quiet || git commit -m "fix: speed up pickup retrieval and add IndexedDB cache"
          git rm -f .github/workflows/fix-offline-cache-pickup.yml 2>/dev/null || true
          git add .github/workflows/fix-client-retrieval-timeouts.yml
          git diff --cached --quiet || git commit -m "chore: finalize client retrieval workflow"
          git push
