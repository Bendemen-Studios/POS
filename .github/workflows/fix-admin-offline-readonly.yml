name: Fix admin offline readonly

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'fix: admin offline readonly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin and app offline behavior
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          admin = Path('pages/admin.js')
          s = admin.read_text(encoding='utf-8')

          # Offline/read-only state.
          if "const [offlineReadOnly, setOfflineReadOnly]" not in s:
              marker = "  const [loading, setLoading] = useState(false);"
              insert = marker + "\n  const [offlineReadOnly, setOfflineReadOnly] = useState(false);"
              if marker not in s:
                  raise SystemExit('admin loading state marker not found')
              s = s.replace(marker, insert, 1)

          # Watch the global server health state and also handle a fully offline browser.
          if "pos:server-status" not in s:
              marker = "  useEffect(() => {\n    const userStr = localStorage.getItem('pos_user');"
              replacement = """  useEffect(() => {
            const updateOfflineState = (online) => {
              const readOnly = online === false;
              setOfflineReadOnly(readOnly);
              if (readOnly) {
                setEditingUser(null);
                setEditingStore(null);
              }
            };
            const statusHandler = (event) => updateOfflineState(Boolean(event.detail?.online));
            const browserOffline = () => updateOfflineState(false);
            const browserOnline = () => {
              // The app-level watcher will confirm whether the VPS itself is reachable.
              updateOfflineState(true);
            };
            window.addEventListener('pos:server-status', statusHandler);
            window.addEventListener('offline', browserOffline);
            window.addEventListener('online', browserOnline);
            updateOfflineState(navigator.onLine !== false);
            return () => {
              window.removeEventListener('pos:server-status', statusHandler);
              window.removeEventListener('offline', browserOffline);
              window.removeEventListener('online', browserOnline);
            };
          }, []);

          useEffect(() => {
            const health = async () => {
              if (navigator.onLine === false) {
                setOfflineReadOnly(true);
                return;
              }
              const controller = new AbortController();
              const timer = setTimeout(() => controller.abort(), 2500);
              try {
                const res = await fetch('/api/admin/store?healthcheck=1&_admin=' + Date.now(), {
                  cache: 'no-store', signal: controller.signal,
                  headers: { 'Cache-Control': 'no-cache, no-store, must-revalidate' }
                });
                setOfflineReadOnly(!res.ok);
              } catch (_) {
                setOfflineReadOnly(true);
              } finally {
                clearTimeout(timer);
              }
            };
            health();
          }, []);

          useEffect(() => {
            if (offlineReadOnly) {
              setEditingUser(null);
              setEditingStore(null);
            }
          }, [offlineReadOnly]);

          useEffect(() => {
            const userStr = localStorage.getItem('pos_user');"""
              if marker not in s:
                  raise SystemExit('admin auth effect marker not found')
              s = s.replace(marker, replacement, 1)

          # SumUp reader cache for offline viewing.
          old = """  const fetchSumUpReaders = async () => {
    try {
      const res = await fetch('/api/sumup/proxy?action=readers');
      const data = await res.json();
      if (data.success) {
        setSumUpReaders(data.readers || []);
      }
    } catch (err) {
      console.error('Kan geen SumUp apparaten ophalen via proxy:', err);
    }
  };"""
          new = """  const fetchSumUpReaders = async () => {
    try {
      const cached = localStorage.getItem('admin_cached_sumup_readers');
      if (cached) {
        const parsed = JSON.parse(cached);
        if (Array.isArray(parsed)) setSumUpReaders(parsed);
      }
    } catch (_) {}
    if (typeof navigator !== 'undefined' && navigator.onLine === false) return;
    try {
      const res = await fetch('/api/sumup/proxy?action=readers', { cache: 'no-store' });
      const data = await res.json();
      if (data.success) {
        const readers = Array.isArray(data.readers) ? data.readers : [];
        setSumUpReaders(readers);
        localStorage.setItem('admin_cached_sumup_readers', JSON.stringify(readers));
      }
    } catch (err) {
      console.warn('[ADMIN] SumUp online refresh mislukt; lokale cache blijft beschikbaar.');
    }
  };"""
          if old in s:
              s = s.replace(old, new, 1)

          # Make the whole data area read-only offline while keeping tabs and the return-to-POS button usable.
          marker = "      <div className=\"flex-1 p-3 sm:p-6 max-w-7xl mx-auto w-full\">"
          if marker in s and "ADMIN_OFFLINE_READONLY_FIELDSET" not in s:
              replacement = """      <div className=\"flex-1 p-3 sm:p-6 max-w-7xl mx-auto w-full\">
        {offlineReadOnly && (
          <div className=\"mb-4 bg-amber-50 border border-amber-300 text-amber-900 rounded-lg p-4 shadow-sm\">
            <div className=\"flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3\">
              <div>
                <div className=\"font-black text-sm uppercase\">🔒 Admin alleen-lezen</div>
                <div className=\"text-xs mt-1\">De VPS/site is offline. Je kunt alle lokaal opgeslagen gegevens bekijken, maar niets wijzigen.</div>
              </div>
              <Link href=\"/\">
                <button type=\"button\" className=\"bg-black text-white px-4 py-2 rounded text-xs font-bold whitespace-nowrap\">🛒 Terug naar Kassa</button>
              </Link>
            </div>
          </div>
        )}
        {/* ADMIN_OFFLINE_READONLY_FIELDSET */}
        <fieldset disabled={offlineReadOnly} className=\"border-0 p-0 m-0 min-w-0\">"""
              s = s.replace(marker, replacement, 1)
              # Close the fieldset immediately before the data-area closing div.
              close_marker = """        )}
      </div>

      {editingUser && ("""
              if close_marker not in s:
                  raise SystemExit('admin data area close marker not found')
              s = s.replace(close_marker, """        )}
        </fieldset>
      </div>

      {editingUser && (""", 1)

          # Ensure modals cannot be edited if the connection drops.
          s = s.replace("      {editingUser && (", "      {!offlineReadOnly && editingUser && (", 1)
          s = s.replace("      {editingStore && (", "      {!offlineReadOnly && editingStore && (", 1)

          # Persist a marker for the patch.
          if "ADMIN_OFFLINE_READONLY_FIXED" not in s:
              s = s.replace("export default function AdminDashboard() {", "// ADMIN_OFFLINE_READONLY_FIXED\n\nexport default function AdminDashboard() {", 1)
          admin.write_text(s, encoding='utf-8')

          # Remove the full-screen admin lock from _app. Admin itself now becomes read-only and keeps its cached view.
          app = Path('pages/_app.js')
          a = app.read_text(encoding='utf-8')
          start = a.find("      {adminOffline && (")
          if start >= 0:
              end = a.find("\n      )}", start)
              if end < 0:
                  raise SystemExit('adminOffline overlay end not found')
              end += len("\n      )}")
              a = a[:start] + a[end:]
          app.write_text(a, encoding='utf-8')

          Path('.github/workflows/fix-admin-offline-readonly.yml').unlink(missing_ok=True)
          PY
      - name: Commit patched POS
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/admin.js pages/_app.js .github/workflows/fix-admin-offline-readonly.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: admin offline readonly"
          git push
