name: Fix SumUp admin store list

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[sumup-admin-fixed-v3]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch admin.js
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('pages/admin.js')
          s = p.read_text()

          # 1. State for the filiaal selected while pairing a NEW reader.
          state_old = "  const [selectedStoreForReader, setSelectedStoreForReader] = useState({});\n"
          state_new = state_old + "  const [selectedStoreForPairing, setSelectedStoreForPairing] = useState('');\n"
          if "selectedStoreForPairing" not in s:
              if state_old not in s:
                  raise SystemExit('Could not find SumUp reader state')
              s = s.replace(state_old, state_new, 1)

          # 2. Return readers from fetchSumUpReaders so pairing can detect the new reader.
          fetch_old = """  const fetchSumUpReaders = async () => {
            try {
              const res = await fetch('/api/sumup/proxy?action=readers');
              const data = await res.json();
              if (data.success) {
                setSumUpReaders(data.readers || []);
              }
            } catch (err) {
              console.error('Kan geen SumUp apparaten ophalen via proxy:', err);
            }
          };"""
          fetch_new = """  const fetchSumUpReaders = async () => {
            try {
              const res = await fetch('/api/sumup/proxy?action=readers', { cache: 'no-store' });
              const data = await res.json().catch(() => ({}));
              if (data.success) {
                const readers = Array.isArray(data.readers) ? data.readers : [];
                setSumUpReaders(readers);
                return readers;
              }
            } catch (err) {
              console.error('Kan geen SumUp apparaten ophalen via proxy:', err);
            }
            return [];
          };"""
          if fetch_old in s:
              s = s.replace(fetch_old, fetch_new, 1)

          # 3. Pair the reader, then automatically assign the newly-created reader to the selected store.
          pair_start = s.find("  const handlePairSumUp = async (e) => {")
          pair_end = s.find("\n\n  const handleUnlinkSumUp", pair_start)
          if pair_start != -1 and pair_end != -1:
              pair_new = """  const handlePairSumUp = async (e) => {
            e.preventDefault();

            if (!selectedStoreForPairing) {
              setSumUpStatusMsg('❌ Selecteer eerst een filiaal.');
              return;
            }

            setSumUpStatusMsg('Bezig met SumUp koppelen...');
            try {
              const beforeReaders = sumUpReaders || [];
              const res = await fetch('/api/sumup/proxy?action=pair', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pairingCode, name: terminalName })
              });
              const data = await res.json();

              if (!res.ok || !data.success) {
                setSumUpStatusMsg(`❌ Fout: ${data.error || 'Onbekende fout'}`);
                return;
              }

              setSumUpStatusMsg('SumUp gekoppeld. Filiaal wordt toegewezen...');
              setPairingCode('');
              setTerminalName('');

              let readers = await fetchSumUpReaders();
              let newReader = readers.find(r => !beforeReaders.some(old => String(old.id) === String(r.id)));

              for (let i = 0; i < 5 && !newReader; i++) {
                await new Promise(resolve => setTimeout(resolve, 1000));
                readers = await fetchSumUpReaders();
                newReader = readers.find(r => !beforeReaders.some(old => String(old.id) === String(r.id)));
              }

              if (!newReader) {
                setSumUpStatusMsg('⚠️ Apparaat gekoppeld, maar nog niet zichtbaar. Ververs en gebruik daarna "Koppel aan Filiaal".');
                return;
              }

              const assignRes = await fetch('/api/sumup/proxy?action=assign-store', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ storeId: selectedStoreForPairing, readerId: newReader.id })
              });
              const assignData = await assignRes.json();

              if (assignRes.ok && assignData.success) {
                const store = stores.find(s => String(s.id || s.store_id) === String(selectedStoreForPairing));
                setSumUpStatusMsg(`✅ SumUp apparaat succesvol gekoppeld aan ${store?.store_name || store?.name || 'het gekozen filiaal'}!`);
                setSelectedStoreForPairing('');
                fetchStores();
                fetchSumUpReaders();
              } else {
                setSumUpStatusMsg(`⚠️ SumUp gekoppeld, maar filiaaltoewijzing mislukt: ${assignData.error || 'Onbekende fout'}`);
              }
            } catch (err) {
              console.error('SumUp pairing error:', err);
              setSumUpStatusMsg('❌ Netwerkfout bij koppelen.');
            }
          };"""
              s = s[:pair_start] + pair_new + s[pair_end:]

          # 4. Always show the filiaal selector in the NEW pairing form.
          form_old = """                    <div className=\"grid grid-cols-1 sm:grid-cols-3 gap-2\">
                      <input
                        type=\"text\"
                        placeholder=\"Pairing Code (van scherm SumUp Solo)\"
                        value={pairingCode}
                        onChange={(e) => setPairingCode(e.target.value)}
                        className=\"p-2 border rounded text-xs\"
                        required
                      />
                      <input
                        type=\"text\"
                        placeholder=\"Naam (bijv. Kassa Balie 1)\"
                        value={terminalName}
                        onChange={(e) => setTerminalName(e.target.value)}
                        className=\"p-2 border rounded text-xs\"
                      />
                      <button type=\"submit\" className=\"bg-red-600 hover:bg-red-700 text-white font-bold p-2 rounded text-xs uppercase\">Koppelen</button>
                    </div>"""
          form_new = """                    <div className=\"grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2\">
                      <input
                        type=\"text\"
                        placeholder=\"Pairing Code (van scherm SumUp Solo)\"
                        value={pairingCode}
                        onChange={(e) => setPairingCode(e.target.value)}
                        className=\"p-2 border rounded text-xs\"
                        required
                      />
                      <input
                        type=\"text\"
                        placeholder=\"Naam (bijv. Kassa Balie 1)\"
                        value={terminalName}
                        onChange={(e) => setTerminalName(e.target.value)}
                        className=\"p-2 border rounded text-xs\"
                      />
                      <select
                        value={selectedStoreForPairing}
                        onChange={(e) => setSelectedStoreForPairing(e.target.value)}
                        className=\"p-2 border rounded text-xs bg-white\"
                        required
                      >
                        <option value=\"\">-- Kies Filiaal --</option>
                        {stores.map(s => (
                          <option key={s.id || s.store_id} value={s.id || s.store_id}>
                            {s.store_name || s.name}
                          </option>
                        ))}
                      </select>
                      <button type=\"submit\" className=\"bg-red-600 hover:bg-red-700 text-white font-bold p-2 rounded text-xs uppercase\">Koppelen</button>
                    </div>"""
          if form_old in s:
              s = s.replace(form_old, form_new, 1)

          # 5. Live orders: only poll while the Bestellingen tab is active.
          orders_marker = "  const fetchUsers = async () => {"
          orders_effect = """  useEffect(() => {
            if (activeTab !== 'orders') return undefined;

            let stopped = false;
            const refreshOrders = async () => {
              if (stopped) return;
              try {
                await fetchOrders();
                if (typeof window !== 'undefined') {
                  window.dispatchEvent(new CustomEvent('pos:ajax-refresh', { detail: { source: 'admin-orders' } }));
                }
              } catch (_) {}
            };

            refreshOrders();
            const timer = setInterval(refreshOrders, 5000);
            return () => {
              stopped = true;
              clearInterval(timer);
            };
          }, [activeTab]);

"""
          if "const timer = setInterval(refreshOrders, 5000);" not in s:
              if orders_marker not in s:
                  raise SystemExit('Could not find fetchUsers marker for orders polling')
              s = s.replace(orders_marker, orders_effect + orders_marker, 1)

          # 6. Make the order request explicitly AJAX/no-cache and emit refresh after data arrives.
          order_old = """  const fetchOrders = async () => {
    try {
      const res = await fetch('/api/woocommerce/orders');
      const data = await res.json();
      if (data.success && data.orders) {
        setOrders(data.orders);
        localStorage.setItem('admin_cached_orders', JSON.stringify(data.orders));
      }
    } catch (err) {
      console.error('Fout bij ophalen bestellingen:', err);
    }
  };"""
          order_new = """  const fetchOrders = async () => {
    try {
      const res = await fetch(`/api/woocommerce/orders?_ajax=${Date.now()}`, {
        cache: 'no-store',
        headers: { 'X-Requested-With': 'XMLHttpRequest', 'Cache-Control': 'no-cache, no-store, must-revalidate' }
      });
      const data = await res.json();
      if (data.success && data.orders) {
        setOrders(data.orders);
        localStorage.setItem('admin_cached_orders', JSON.stringify(data.orders));
        if (typeof window !== 'undefined') {
          window.dispatchEvent(new CustomEvent('pos:orders-updated', { detail: { orders: data.orders } }));
        }
      }
    } catch (err) {
      console.error('Fout bij ophalen bestellingen:', err);
    }
  };"""
          if order_old in s:
              s = s.replace(order_old, order_new, 1)

          marker = '// SUMUP_ADMIN_PAIRING_SELECTOR_AND_LIVE_ORDERS_FIXED'
          if marker not in s:
              s = s.replace('export default function AdminDashboard() {', marker + '\n\nexport default function AdminDashboard() {', 1)

          p.write_text(s)
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/admin.js
          git commit -m "Fix SumUp branch selector and live orders [sumup-admin-fixed-v3]"
          git push
