<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>BENDEMEN POS — Offline</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f3f4f6;color:#111}
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
    main{width:100%;max-width:440px;background:#fff;border-radius:14px;padding:32px;box-sizing:border-box;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.12)}
    h1{margin:0 0 10px;font-size:24px;font-weight:900;letter-spacing:.04em}
    p{margin:0;color:#6b7280;line-height:1.5;font-size:14px}
    .status{display:inline-block;margin:0 0 18px;padding:7px 12px;border-radius:999px;background:#fef3c7;color:#92400e;font-size:12px;font-weight:800}
  </style>
</head>
<body>
  <main>
    <div class="status">⚠️ SERVER OFFLINE</div>
    <h1>BENDEMEN POS</h1>
    <p>De server is tijdelijk niet bereikbaar. De lokaal opgeslagen POS-gegevens blijven beschikbaar zodra de offline kassa-app geladen kan worden.</p>
  </main>
</body>
</html>
